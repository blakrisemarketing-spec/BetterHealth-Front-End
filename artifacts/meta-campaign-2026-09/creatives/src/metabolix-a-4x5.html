<!doctype html>
<html lang="en" style="--W:1080px;--H:1350px;--pad-top:84px;--pad-bottom:84px">

    <style>
/* Shared base for every BetterHealth Meta creative. Injected into each template by build.mjs. */
@font-face {
  font-family: "Quicksand";
  src: url("../assets/Quicksand.woff2") format("woff2");
  font-weight: 300 700;
  font-style: normal;
  font-display: block;
}

:root {
  --cream: #f5f3ee;
  --sage: #6b8e7f;
  --sage-on-dark: #86ab9c;
  --ink: #2b3a3a;
  --line: #e0dcd5;
  --muted: #6b7979;
  --dark: #0f1724;
  --dark-card: #1a2537;
  --pad-x: 90px;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: var(--W);
  height: var(--H);
  overflow: hidden;
}

body {
  font-family: "Quicksand", Arial, Helvetica, sans-serif;
  color: var(--ink);
  background: var(--canvas);
  -webkit-font-smoothing: antialiased;
}

.frame {
  position: relative;
  width: var(--W);
  height: var(--H);
  overflow: hidden;
  background: var(--canvas);
  padding: var(--pad-top) var(--pad-x) var(--pad-bottom);
}

.tick {
  flex: none;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--sage);
  display: grid;
  place-items: center;
}

.tick svg {
  width: 16px;
  height: 16px;
  display: block;
}

.nowrap {
  white-space: nowrap;
}


      :root {

  <body data-size="4x5" data-mode="p-card">

    <script>
      window.__fit = function () {
        var out = [];
        var els = document.querySelectorAll("[data-fit]");
        for (var i = 0; i < els.length; i++) {
          var el = els[i];
          var spec = el.getAttribute("data-fit").split(",").map(Number);
          var max = spec[0], min = spec[1], maxLines = spec[2] || 4;
          var box = el.closest("[data-fit-box]") || document.querySelector(".frame");
          var size = max, lines = 0;
          for (;;) {
            el.style.fontSize = size + "px";
            var lh = parseFloat(getComputedStyle(el).lineHeight);
            lines = Math.round(el.getBoundingClientRect().height / lh);
            var ok =
              lines <= maxLines &&
              box.scrollHeight <= box.clientHeight + 1 &&
              el.scrollWidth <= el.clientWidth + 1;
            if (ok || size <= min) break;
            size -= 2;
          }
          el.setAttribute("data-fit-size", String(size));
          el.setAttribute("data-fit-lines", String(lines));
          out.push({ el: el.className || el.tagName.toLowerCase(), size: size, lines: lines, overflow: box.scrollHeight > box.clientHeight + 1 });
        }
        return out;
      };
      document.fonts.ready.then(function () { window.__fit(); });
    </script>
  </body>
