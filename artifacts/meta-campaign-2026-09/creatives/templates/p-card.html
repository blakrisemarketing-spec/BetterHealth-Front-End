<!doctype html>
<html lang="en" style="{{sizeVars}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080" />
    <title>{{title}}</title>
    <style>
{{baseCss}}

      :root {
        --canvas: var(--cream);
      }

      .frame {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .brand-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .logo {
        width: 300px;
        height: auto;
        display: block;
      }

      .badge {
        border: 1.5px solid var(--line);
        border-radius: 999px;
        padding: 14px 30px 15px;
        color: var(--muted);
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        line-height: 1;
        white-space: nowrap;
      }

      .headline-group {
        margin-top: 44px;
      }

      .eyebrow {
        color: var(--sage);
        font-size: 32px;
        font-weight: 600;
        letter-spacing: -0.01em;
        line-height: 1.1;
      }

      h1 {
        margin: 14px 0 0;
        color: var(--ink);
        font-size: 104px;
        line-height: 0.98;
        font-weight: 600;
        letter-spacing: -0.02em;
        text-wrap: balance;
      }

      .subline {
        margin-top: 16px;
        color: var(--sage);
        font-size: 38px;
        font-weight: 600;
        letter-spacing: -0.01em;
        line-height: 1.1;
      }

      .offer-group {
        margin-top: 40px;
      }

      .tests {
        background: #ffffff;
        border: 1.5px solid var(--line);
        border-radius: 12px;
        padding: 32px 34px;
        box-shadow: 0 12px 30px rgba(43, 58, 58, 0.06);
      }

      .tests ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px 28px;
      }

      .tests li {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        color: var(--ink);
        font-size: 27px;
        font-weight: 500;
        line-height: 1.2;
        letter-spacing: -0.01em;
      }

      .tests li span:last-child {
        text-wrap: balance;
      }

      .tests .tick {
        margin-top: 1px;
      }

      .price {
        margin-top: 40px;
        display: flex;
        align-items: baseline;
        gap: 14px;
      }

      .price .cur {
        font-size: 44px;
        font-weight: 600;
        color: var(--muted);
        letter-spacing: 0.02em;
      }

      .price .amount {
        font-size: 120px;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 0.9;
        color: var(--ink);
      }

      .price .vat {
        font-size: 26px;
        font-weight: 500;
        color: var(--muted);
        margin-left: 8px;
      }

      .cta-band {
        margin-top: 40px;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 36px;
        align-items: center;
        min-height: 138px;
        border: 1.5px solid var(--line);
        border-radius: 12px;
        background: #ffffff;
        padding: 28px 34px;
        box-shadow: 0 12px 30px rgba(43, 58, 58, 0.06);
      }

      .cta-copy {
        color: var(--ink);
        font-size: 27px;
        line-height: 1.22;
        font-weight: 500;
        letter-spacing: -0.01em;
      }

      .cta-copy .turn {
        display: block;
        margin-top: 8px;
        color: var(--sage);
        font-weight: 600;
        font-size: 24px;
      }

      .cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 84px;
        border-radius: 8px;
        background: var(--sage);
        color: #ffffff;
        padding: 0 30px;
        font-size: 24px;
        font-weight: 600;
        white-space: nowrap;
      }
    </style>
  </head>
  <body data-size="{{size}}" data-mode="p-card">
    <main class="frame" aria-label="{{title}}">
      <header class="brand-row">
        <img class="logo" src="../assets/logo.png" alt="BetterHealth Africa" />
        <div class="badge">{{badge}}</div>
      </header>

      <section class="headline-group">
        <div class="eyebrow">{{eyebrow}}</div>
        <h1 data-fit="104,72,2">{{headline}}</h1>
        {{subline}}
      </section>

      <section class="offer-group">
        <div class="tests">
          <ul>
{{tests}}
          </ul>
        </div>
        <div class="price">
          <span class="cur">GHS</span><span class="amount">{{price}}</span><span class="vat">excl. VAT</span>
        </div>
      </section>

      <section class="cta-band">
        <div class="cta-copy">Doctor-reviewed results, explained in plain English<span class="turn">{{turnaround}}</span></div>
        <div class="cta">Book on betterhealth.africa</div>
      </section>
    </main>
{{fitScript}}
  </body>
</html>
