    <!-- Quicksand variable font + Inter (Google Fonts CDN). Inter is the body face on /foundation.
         Loaded non-render-blocking: preload the stylesheet, then apply it async via
         media="print"/onload so it never blocks first paint (~800ms saved on cold loads,
         which matters most for the mobile/3G Ghana audience). display=swap avoids FOIT. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Quicksand:wght@300..700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Quicksand:wght@300..700&display=swap" media="print" onload="this.media='all'" />

    <!--
      Analytics host gate — tracking is PRODUCTION ONLY.

      The staging site (bha-devon.vercel.app) and every local build are served
      from this same index.html, so they carry these exact GA4 / GTM / Pixel
      IDs. Without this gate, a pageview or a test booking on staging lands in
      the very dataset the ad campaigns are judged and optimised on — which is
      the failure the deployment runbook warns about for this repo by name.

      Gating at the loaders means nothing is even requested off-production.
      src/lib/analytics.js guards the event sinks as well, so a future event
      helper cannot reintroduce the leak by forgetting to check.
    -->
    <script>
      window.__BH_TRACKING_ENABLED__ =
        location.hostname === 'betterhealth.africa' ||
        location.hostname === 'www.betterhealth.africa';
    </script>
    <!-- Google tag (gtag.js) + Google Tag Manager + Meta Pixel -->
    <script>

        window.gtag = function () { window.dataLayer.push(arguments); };

        var gtagSrc = document.createElement('script');
        gtagSrc.async = true;

        (function (w, d, s, l, i) {

          j.async = true;
          j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl;
          f.parentNode.insertBefore(j, f);
        })(window, document, 'script', 'dataLayer', 'GTM-MS22RHNF');

        !function(f,b,e,v,n,t,s)
        {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
        n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)}(window,document,'script',
        'https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', '2118966258986670');
        fbq('track', 'PageView');
      }
    </script>

    <!--
      There was a spa-github-pages redirect decoder here. It paired with
      public/404.html to smuggle a deep-link path through the query string, which
      GitHub Pages needed because it serves 404.html for unknown routes.

      The site moved to Hostinger (LiteSpeed). public/.htaccess now does the
      routing server-side and ErrorDocument points at /index.html, so 404.html is
      never served and nothing ever produces the encoded format. The decoder was
      dead code — but it was still running, guarded only by `l.search.length > 1`,
      so it treated any ordinary query string as an encoded redirect: it split the
      query on "&", rejoined the parts with "?", and replaceState'd the result over
      the path. Every URL carrying a query string 404'd, homepage included, which
      meant 100% of UTM-tagged ad and email traffic landed on Page Not Found.

      Do not reintroduce this without also moving the site back to GitHub Pages.
    -->
