name: Build check

# The live site is built and served by Hostinger (LiteSpeed), which auto-builds
# the repo and serves dist/ on every push to main — GitHub does NOT deploy.
# This workflow only verifies that `npm run build` succeeds, so a broken build is
# caught here (on the PR and on the push) before Hostinger picks up the commit.
# (Replaces the retired GitHub Pages deploy from the pre-Hostinger era.)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_WAITLIST_API_URL: ${{ secrets.WAITLIST_API_URL }}
