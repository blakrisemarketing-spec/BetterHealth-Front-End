<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6B8E7F" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#6B8E7F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="480" fill="#F5F3EE"/>
  <circle cx="1010" cy="150" r="320" fill="url(#orb)"/>

  <text x="90" y="140" font-size="22" font-weight="700" letter-spacing="3" fill="#6B8E7F">PREGNANCY SCREENING</text>
  <text x="86" y="218" font-size="52" font-weight="800" fill="#2B3A3A">The antenatal blood</text>
  <text x="86" y="280" font-size="52" font-weight="800" fill="#2B3A3A">test panel, explained</text>
  <text x="90" y="326" font-size="24" fill="#6B7979">Blood group, anaemia, HIV, hepatitis B, genotype and blood sugar screening.</text>

  <!-- test badges -->
  <g font-size="19" font-weight="700" fill="#2B3A3A">
    <rect x="90" y="366" width="164" height="50" rx="25" fill="#EAF1EC" stroke="#6B8E7F" stroke-width="2"/>
    <text x="172" y="398" text-anchor="middle">Blood group</text>

    <rect x="270" y="366" width="150" height="50" rx="25" fill="#F3EEDF" stroke="#E0A23E" stroke-width="2"/>
    <text x="345" y="398" text-anchor="middle">Anaemia</text>

    <rect x="436" y="366" width="150" height="50" rx="25" fill="#F6E3E0" stroke="#C9594F" stroke-width="2"/>
    <text x="511" y="398" text-anchor="middle">HIV / HBsAg</text>

    <rect x="602" y="366" width="150" height="50" rx="25" fill="#EDEAF6" stroke="#8E7FC9" stroke-width="2"/>
    <text x="677" y="398" text-anchor="middle">Genotype</text>

    <rect x="768" y="366" width="176" height="50" rx="25" fill="#EAF1EC" stroke="#6B8E7F" stroke-width="2"/>
    <text x="856" y="398" text-anchor="middle">Blood sugar</text>
  </g>
</svg>
