<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6B8E7F" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#6B8E7F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="480" fill="#F5F3EE"/>
  <circle cx="1010" cy="150" r="320" fill="url(#orb)"/>

  <text x="90" y="172" font-size="22" font-weight="700" letter-spacing="3" fill="#6B8E7F">UNDERSTANDING YOUR BIOMARKERS</text>
  <text x="86" y="252" font-size="58" font-weight="800" fill="#2B3A3A">The PSA test, explained</text>
  <text x="90" y="302" font-size="26" fill="#6B7979">A protein level, not a cancer diagnosis on its own.</text>

  <!-- simple droplet / test-tube motif with a single data marker -->
  <path d="M 150 350 C 150 400, 190 430, 235 430 C 280 430, 320 400, 320 350 C 320 310, 280 260, 235 210 C 190 260, 150 310, 150 350 Z"
        fill="none" stroke="#6B8E7F" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="235" cy="360" r="10" fill="#6B8E7F"/>

  <!-- horizontal scale from normal to raised, with marker -->
  <line x1="420" y1="400" x2="1090" y2="400" stroke="#D8D3C6" stroke-width="10" stroke-linecap="round"/>
  <line x1="420" y1="400" x2="760" y2="400" stroke="#6B8E7F" stroke-width="10" stroke-linecap="round"/>
  <circle cx="760" cy="400" r="14" fill="#2B3A3A"/>
  <text x="420" y="368" font-size="18" fill="#6B7979">Typical range</text>
  <text x="1015" y="368" font-size="18" fill="#6B7979">Raised, needs review</text>
</svg>
