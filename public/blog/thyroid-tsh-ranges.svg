<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="1200" height="380" fill="#FFFFFF"/>
  <text x="70" y="66" font-size="34" font-weight="700" fill="#2B3A3A">TSH result bands</text>
  <text x="70" y="100" font-size="20" fill="#6B7979">A typical adult reference range, in mIU/L</text>

  <!-- band labels -->
  <text x="251" y="150" font-size="22" font-weight="700" fill="#C9594F" text-anchor="middle">Low (overactive)</text>
  <text x="554" y="150" font-size="23" font-weight="700" fill="#6B8E7F" text-anchor="middle">Normal</text>
  <text x="903" y="150" font-size="22" font-weight="700" fill="#C28A2E" text-anchor="middle">High (underactive)</text>

  <!-- segmented bar -->
  <clipPath id="bar"><rect x="70" y="170" width="1060" height="64" rx="16"/></clipPath>
  <g clip-path="url(#bar)">
    <rect x="70" y="170" width="363" height="64" fill="#C9594F"/>
    <rect x="433" y="170" width="243" height="64" fill="#6B8E7F"/>
    <rect x="676" y="170" width="454" height="64" fill="#C28A2E"/>
  </g>

  <!-- threshold ticks -->
  <line x1="433" y1="166" x2="433" y2="252" stroke="#2B3A3A" stroke-width="2"/>
  <line x1="676" y1="166" x2="676" y2="252" stroke="#2B3A3A" stroke-width="2"/>
  <text x="433" y="282" font-size="22" font-weight="700" fill="#2B3A3A" text-anchor="middle">0.4</text>
  <text x="676" y="282" font-size="22" font-weight="700" fill="#2B3A3A" text-anchor="middle">4.0</text>

  <!-- sub labels -->
  <text x="251" y="328" font-size="18" fill="#6B7979" text-anchor="middle">Below 0.4 mIU/L</text>
  <text x="554" y="328" font-size="18" fill="#6B7979" text-anchor="middle">0.4 to 4.0 mIU/L</text>
  <text x="903" y="328" font-size="18" fill="#6B7979" text-anchor="middle">Above 4.0 mIU/L</text>
  <text x="70" y="364" font-size="15" fill="#9AA6A6">Illustrative adult range. Exact cutoffs vary by lab and assay; always read your own lab's reference interval.</text>
</svg>
