    <rect x="256" y="340" width="170" height="50" rx="25" fill="#6B8E7F"/>
    <text x="341" y="372" text-anchor="middle">Blood group</text>

    <rect x="442" y="340" width="220" height="50" rx="25" fill="#6B8E7F"/>
    <text x="552" y="372" text-anchor="middle">Infectious disease</text>
