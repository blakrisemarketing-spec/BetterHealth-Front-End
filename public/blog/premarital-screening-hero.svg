<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-label="Premarital screening explained: the tests every couple should do before marriage" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Premarital Screening: The Tests Every Couple Should Do Before Marriage</title>
  <defs>
    <radialGradient id="orb-pms" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6B8E7F" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#6B8E7F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="#F5F3EE"/>
  <circle cx="1030" cy="160" r="310" fill="url(#orb-pms)"/>

  <!-- Category label -->
  <text x="90" y="172" font-size="22" font-weight="700" letter-spacing="3" fill="#6B8E7F">BEFORE YOU SAY I DO</text>

  <!-- Main title -->
  <text x="86" y="252" font-size="54" font-weight="800" fill="#2B3A3A">Premarital screening,</text>
  <text x="86" y="312" font-size="54" font-weight="800" fill="#2B3A3A">explained</text>

  <!-- Subtitle -->
  <text x="90" y="352" font-size="24" fill="#6B7979">The tests couples in Nigeria and Ghana take before marriage.</text>

  <!-- Pill badges -->
  <rect x="90" y="384" width="150" height="42" rx="21" fill="#2B3A3A"/>
  <text x="165" y="411" text-anchor="middle" font-size="16" font-weight="700" fill="#F5F3EE">Genotype</text>

  <rect x="254" y="384" width="150" height="42" rx="21" fill="#C9594F"/>
  <text x="329" y="411" text-anchor="middle" font-size="16" font-weight="700" fill="#F5F3EE">Rh Factor</text>

  <rect x="418" y="384" width="220" height="42" rx="21" fill="#6B8E7F"/>
  <text x="528" y="411" text-anchor="middle" font-size="16" font-weight="700" fill="#F5F3EE">Infectious Disease</text>

  <rect x="652" y="384" width="200" height="42" rx="21" fill="#A8C5B8"/>
  <text x="752" y="411" text-anchor="middle" font-size="16" font-weight="700" fill="#2B3A3A">Informed Choice</text>

  <!-- Decorative right: two interlocking rings + a small heart, echoing a couple/union motif -->
  <circle cx="990" cy="130" r="46" fill="none" stroke="#6B8E7F" stroke-width="8" opacity="0.45"/>
  <circle cx="1050" cy="130" r="46" fill="none" stroke="#C9594F" stroke-width="8" opacity="0.35"/>
  <path d="M 1015 250 C 995 225, 950 235, 950 268 C 950 296, 985 320, 1015 340 C 1045 320, 1080 296, 1080 268 C 1080 235, 1035 225, 1015 250 Z" fill="#6B8E7F" opacity="0.20"/>
  <circle cx="1120" cy="220" r="14" fill="#2B3A3A" opacity="0.12"/>
</svg>
