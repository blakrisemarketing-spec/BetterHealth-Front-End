<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-label="Cholera: symptoms, testing, and why rehydration comes first" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Cholera: Symptoms, Testing, and Why Rehydration Comes First</title>
  <defs>
