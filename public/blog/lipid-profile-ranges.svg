<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-label="Lipid profile normal ranges for total cholesterol, LDL, HDL, and triglycerides">
  <title>Lipid Profile Normal Ranges: Total Cholesterol, LDL, HDL, Triglycerides</title>
  <defs>
    <linearGradient id="gGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="yGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="rGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="bGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="720" height="380" fill="#F9FAFB" rx="12"/>

  <!-- Title -->
  <text x="360" y="34" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="bold" fill="#111827">Lipid Profile Normal Ranges</text>
  <text x="360" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#6B7280">ACC/AHA 2018 and NCEP ATP III thresholds — mmol/L (mg/dL in brackets)</text>

  <!-- ROW 1: Total Cholesterol -->
  <!-- Label -->
  <text x="20" y="93" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#374151">Total</text>
  <text x="20" y="108" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#374151">Cholesterol</text>
  <!-- Bar track -->
  <rect x="140" y="82" width="560" height="34" rx="17" fill="#E5E7EB"/>
  <!-- Desirable: 0-5.2 of range 0-8, scale 560px / 8 = 70px per unit. 5.2*70=364px -->
  <rect x="140" y="82" width="17" height="34" rx="17 0 0 17" fill="url(#gGrad)"/>
  <rect x="140" y="82" width="364" height="34" rx="0" fill="url(#gGrad)"/>
  <!-- Borderline: 5.2-6.2 = 1.0 unit = 70px -->
  <rect x="504" y="82" width="70" height="34" fill="url(#yGrad)"/>
  <!-- High: 6.2+ -->
  <rect x="574" y="82" width="109" height="34" rx="0 17 17 0" fill="url(#rGrad)"/>
  <!-- Labels -->
  <text x="310" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">Desirable</text>
  <text x="539" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fff">Border.</text>
  <text x="625" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">High</text>
  <!-- Threshold ticks -->
  <line x1="504" y1="116" x2="504" y2="124" stroke="#374151" stroke-width="1.5"/>
  <text x="504" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">5.2</text>
  <line x1="574" y1="116" x2="574" y2="124" stroke="#374151" stroke-width="1.5"/>
  <text x="574" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">6.2</text>

  <!-- ROW 2: LDL Cholesterol -->
  <text x="20" y="170" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#374151">LDL</text>
  <text x="20" y="185" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#374151">Cholesterol</text>
  <!-- Bar track -->
  <rect x="140" y="159" width="560" height="34" rx="17" fill="#E5E7EB"/>
  <!-- Optimal: 0-2.6 of range 0-6. Scale 560/6 = 93.3px/unit. 2.6*93.3=243px -->
  <rect x="140" y="159" width="17" height="34" rx="17 0 0 17" fill="url(#gGrad)"/>
  <rect x="140" y="159" width="243" height="34" fill="url(#gGrad)"/>
  <!-- Near optimal: 2.6-3.4 = 0.8 unit = 75px -->
  <rect x="383" y="159" width="75" height="34" fill="url(#gGrad)" opacity="0.6"/>
  <!-- Borderline: 3.4-4.1 = 0.7 unit = 65px -->
  <rect x="458" y="159" width="65" height="34" fill="url(#yGrad)"/>
  <!-- High: 4.1+ -->
  <rect x="523" y="159" width="160" height="34" rx="0 17 17 0" fill="url(#rGrad)"/>
  <!-- Labels -->
  <text x="261" y="181" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">Optimal</text>
  <text x="490" y="181" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fff">Borderline</text>
  <text x="595" y="181" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">High</text>
  <!-- Ticks -->
  <line x1="383" y1="193" x2="383" y2="201" stroke="#374151" stroke-width="1.5"/>
  <text x="383" y="213" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">2.6</text>
  <line x1="458" y1="193" x2="458" y2="201" stroke="#374151" stroke-width="1.5"/>
  <text x="458" y="213" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">3.4</text>
  <line x1="523" y1="193" x2="523" y2="201" stroke="#374151" stroke-width="1.5"/>
  <text x="523" y="213" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">4.1</text>

  <!-- ROW 3: HDL Cholesterol -->
  <text x="20" y="247" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#374151">HDL</text>
  <text x="20" y="262" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#374151">Cholesterol</text>
  <!-- For HDL: higher = better. Range 0-2.5. Scale 560/2.5=224px/unit -->
  <!-- Low (bad): 0-1.0 = 224px -->
  <rect x="140" y="236" width="224" height="34" rx="17 0 0 17" fill="url(#rGrad)"/>
  <!-- Good: 1.0-1.6 = 0.6 unit = 134px -->
  <rect x="364" y="236" width="134" height="34" fill="url(#yGrad)"/>
  <!-- Protective: 1.6+ = 0.9 unit = 202px -->
  <rect x="498" y="236" width="202" height="34" rx="0 17 17 0" fill="url(#gGrad)"/>
  <!-- Labels -->
  <text x="252" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">Low (risk)</text>
  <text x="431" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">Good</text>
  <text x="590" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">Protective</text>
  <!-- Ticks -->
  <line x1="364" y1="270" x2="364" y2="278" stroke="#374151" stroke-width="1.5"/>
  <text x="364" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">1.0</text>
  <line x1="498" y1="270" x2="498" y2="278" stroke="#374151" stroke-width="1.5"/>
  <text x="498" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">1.6</text>
  <!-- HDL note -->
  <text x="140" y="306" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">mmol/L (men: low below 1.0; women: low below 1.3)</text>

  <!-- ROW 4: Triglycerides -->
  <text x="20" y="337" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#374151">Triglycer-</text>
  <text x="20" y="352" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#374151">ides</text>
  <!-- Range 0-6. Scale 560/6=93.3px/unit. Normal: 0-1.7=159px -->
  <rect x="140" y="320" width="159" height="34" rx="17 0 0 17" fill="url(#gGrad)"/>
  <!-- Borderline: 1.7-2.3 = 0.6*93.3=56px -->
  <rect x="299" y="320" width="56" height="34" fill="url(#yGrad)"/>
  <!-- High: 2.3-5.7 = 3.4*93.3=317px -->
  <rect x="355" y="320" width="317" height="34" rx="0 17 17 0" fill="url(#rGrad)"/>
  <!-- Labels -->
  <text x="219" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">Normal</text>
  <text x="327" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#fff">Bord.</text>
  <text x="510" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">High</text>
  <!-- Ticks -->
  <line x1="299" y1="354" x2="299" y2="362" stroke="#374151" stroke-width="1.5"/>
  <text x="299" y="374" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">1.7</text>
  <line x1="355" y1="354" x2="355" y2="362" stroke="#374151" stroke-width="1.5"/>
  <text x="355" y="374" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">2.3</text>

</svg>
