<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="1200" height="770" fill="#FFFFFF"/>
  <text x="80" y="66" font-size="34" font-weight="700" fill="#2B3A3A">What's typically in a full body checkup</text>
  <text x="80" y="100" font-size="20" fill="#6B7979">Core categories most comprehensive packages bundle together</text>

  <g>
    <!-- row 1 -->
    <g transform="translate(80,140)">
      <rect width="520" height="120" rx="16" fill="#F1F4F2"/>
      <rect width="8" height="120" rx="4" fill="#6B8E7F"/>
      <text x="40" y="48" font-size="24" font-weight="700" fill="#2B3A3A">Full blood count</text>
      <text x="40" y="76" font-size="18" fill="#6B7979">Anaemia, infection, clotting cells</text>
      <text x="40" y="100" font-size="15" fill="#9AA6A6">Blood health</text>
    </g>
    <g transform="translate(640,140)">
      <rect width="520" height="120" rx="16" fill="#F1F4F2"/>
      <rect width="8" height="120" rx="4" fill="#6B8E7F"/>
      <text x="40" y="48" font-size="24" font-weight="700" fill="#2B3A3A">Blood sugar (glucose, HbA1c)</text>
      <text x="40" y="76" font-size="18" fill="#6B7979">Diabetes and prediabetes risk</text>
      <text x="40" y="100" font-size="15" fill="#9AA6A6">Metabolic</text>
    </g>
    <!-- row 2 -->
    <g transform="translate(80,284)">
      <rect width="520" height="120" rx="16" fill="#F1F4F2"/>
      <rect width="8" height="120" rx="4" fill="#6B8E7F"/>
      <text x="40" y="48" font-size="24" font-weight="700" fill="#2B3A3A">Lipid profile (cholesterol)</text>
      <text x="40" y="76" font-size="18" fill="#6B7979">Heart and stroke risk</text>
      <text x="40" y="100" font-size="15" fill="#9AA6A6">Metabolic</text>
    </g>
    <g transform="translate(640,284)">
      <rect width="520" height="120" rx="16" fill="#F1F4F2"/>
      <rect width="8" height="120" rx="4" fill="#6B8E7F"/>
      <text x="40" y="48" font-size="24" font-weight="700" fill="#2B3A3A">Liver function (ALT, AST)</text>
      <text x="40" y="76" font-size="18" fill="#6B7979">Liver strain, hepatitis follow-up</text>
      <text x="40" y="100" font-size="15" fill="#9AA6A6">Organ function</text>
    </g>
    <!-- row 3 -->
    <g transform="translate(80,428)">
      <rect width="520" height="120" rx="16" fill="#F1F4F2"/>
      <rect width="8" height="120" rx="4" fill="#6B8E7F"/>
      <text x="40" y="48" font-size="24" font-weight="700" fill="#2B3A3A">Kidney function (creatinine, eGFR)</text>
      <text x="40" y="76" font-size="18" fill="#6B7979">Kidney filtering capacity</text>
      <text x="40" y="100" font-size="15" fill="#9AA6A6">Organ function</text>
    </g>
    <g transform="translate(640,428)">
      <rect width="520" height="120" rx="16" fill="#F1F4F2"/>
      <rect width="8" height="120" rx="4" fill="#6B8E7F"/>
      <text x="40" y="48" font-size="24" font-weight="700" fill="#2B3A3A">Thyroid (TSH)</text>
      <text x="40" y="76" font-size="18" fill="#6B7979">Metabolism and hormone balance</text>
      <text x="40" y="100" font-size="15" fill="#9AA6A6">Hormones</text>
    </g>
    <!-- row 4 -->
    <g transform="translate(80,572)">
      <rect width="520" height="120" rx="16" fill="#F1F4F2"/>
      <rect width="8" height="120" rx="4" fill="#6B8E7F"/>
      <text x="40" y="48" font-size="24" font-weight="700" fill="#2B3A3A">Urinalysis</text>
      <text x="40" y="76" font-size="18" fill="#6B7979">Kidney and urinary tract screen</text>
      <text x="40" y="100" font-size="15" fill="#9AA6A6">Urine</text>
    </g>
    <g transform="translate(640,572)">
      <rect width="520" height="120" rx="16" fill="#EFEDE7"/>
      <text x="40" y="48" font-size="22" font-weight="700" fill="#6B7979">Optional add-ons</text>
      <text x="40" y="78" font-size="17" fill="#9AA6A6">Imaging, cancer markers, ECG,</text>
      <text x="40" y="100" font-size="17" fill="#9AA6A6">chosen by age and risk, not fixed</text>
    </g>
  </g>
  <text x="80" y="744" font-size="15" fill="#9AA6A6">General guidance; the exact bundle varies by provider. See /what-we-test for BetterHealth's current panel.</text>
</svg>
