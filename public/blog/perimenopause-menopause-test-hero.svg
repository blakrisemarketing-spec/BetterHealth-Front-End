<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-label="Perimenopause and menopause testing explained: what an FSH test can and cannot tell you" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
