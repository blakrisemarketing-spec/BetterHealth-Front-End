  <text x="86" y="240" font-size="50" font-weight="800" fill="#2B3A3A">Perimenopause and</text>
  <text x="86" y="298" font-size="50" font-weight="800" fill="#2B3A3A">Menopause Testing</text>
  <text x="90" y="342" font-size="26" fill="#6B7979">What an FSH test can (and can't) tell you</text>

