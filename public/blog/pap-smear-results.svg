<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="1200" height="380" fill="#FFFFFF"/>
  <text x="70" y="60" font-size="32" font-weight="700" fill="#2B3A3A">What your result category means</text>
  <text x="70" y="92" font-size="19" fill="#6B7979">Three broad result categories, not a diagnosis on their own</text>

  <!-- three cards -->
  <g>
    <rect x="70" y="130" width="330" height="200" rx="16" fill="#F5F3EE" stroke="#6B8E7F" stroke-width="2"/>
    <circle cx="110" cy="172" r="10" fill="#6B8E7F"/>
    <text x="132" y="179" font-size="22" font-weight="700" fill="#6B8E7F">Normal</text>
    <text x="94" y="216" font-size="16" fill="#2B3A3A">No abnormal cells or high-risk</text>
    <text x="94" y="240" font-size="16" fill="#2B3A3A">HPV found.</text>
    <text x="94" y="278" font-size="16" fill="#6B7979">Return for your next routine</text>
    <text x="94" y="300" font-size="16" fill="#6B7979">screening, on schedule.</text>
  </g>

  <g>
    <rect x="435" y="130" width="330" height="200" rx="16" fill="#F5F3EE" stroke="#C28A2E" stroke-width="2"/>
    <circle cx="475" cy="172" r="10" fill="#C28A2E"/>
    <text x="497" y="179" font-size="22" font-weight="700" fill="#C28A2E">Unclear (ASC-US)</text>
    <text x="459" y="216" font-size="16" fill="#2B3A3A">Some cells look mildly</text>
    <text x="459" y="240" font-size="16" fill="#2B3A3A">unusual, cause is uncertain.</text>
    <text x="459" y="278" font-size="16" fill="#6B7979">Often means a repeat test or</text>
    <text x="459" y="300" font-size="16" fill="#6B7979">an HPV check, not alarm.</text>
  </g>

  <g>
    <rect x="800" y="130" width="330" height="200" rx="16" fill="#F5F3EE" stroke="#C9594F" stroke-width="2"/>
    <circle cx="840" cy="172" r="10" fill="#C9594F"/>
    <text x="862" y="179" font-size="22" font-weight="700" fill="#C9594F">Abnormal</text>
    <text x="824" y="216" font-size="16" fill="#2B3A3A">Cell changes found that need</text>
    <text x="824" y="240" font-size="16" fill="#2B3A3A">a closer look.</text>
    <text x="824" y="278" font-size="16" fill="#6B7979">Usually means monitoring or a</text>
    <text x="824" y="300" font-size="16" fill="#6B7979">colposcopy, not cancer.</text>
  </g>

  <text x="70" y="360" font-size="15" fill="#9AA6A6">Illustrative summary only. An abnormal result is not a cancer diagnosis. Ask your clinician what your specific result means.</text>
</svg>
