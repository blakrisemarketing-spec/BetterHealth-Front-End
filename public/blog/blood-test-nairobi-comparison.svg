<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="1200" height="560" fill="#FFFFFF"/>
  <text x="70" y="56" font-size="30" font-weight="700" fill="#2B3A3A">Three ways to get a blood test in Nairobi</text>
  <text x="70" y="88" font-size="18" fill="#6B7979">Pick the option that fits your schedule, budget, and how urgent the result is.</text>

  <!-- three columns -->
  <rect x="70" y="118" width="340" height="390" rx="14" fill="#F5F3EE"/>
  <rect x="430" y="118" width="340" height="390" rx="14" fill="#F1F4F2"/>
  <rect x="790" y="118" width="340" height="390" rx="14" fill="#F5F3EE"/>

  <text x="100" y="158" font-size="22" font-weight="700" fill="#2B3A3A">Walk-in lab</text>
  <text x="100" y="192" font-size="15" fill="#6B7979">No appointment needed</text>
  <text x="100" y="220" font-size="15" fill="#6B7979">Usually the fastest to start</text>
  <text x="100" y="248" font-size="15" fill="#6B7979">You travel to the branch</text>
  <text x="100" y="276" font-size="15" fill="#6B7979">Good for single, routine tests</text>
  <text x="100" y="304" font-size="15" fill="#6B7979">May involve a short queue</text>
  <text x="100" y="360" font-size="15" font-weight="700" fill="#6B8E7F">Best for: quick, planned</text>
  <text x="100" y="382" font-size="15" font-weight="700" fill="#6B8E7F">single tests</text>

  <text x="460" y="158" font-size="22" font-weight="700" fill="#2B3A3A">Home blood draw</text>
  <text x="460" y="192" font-size="15" fill="#6B7979">A phlebotomist comes to you</text>
  <text x="460" y="220" font-size="15" fill="#6B7979">No travel or queueing</text>
  <text x="460" y="248" font-size="15" fill="#6B7979">Booked in advance for a slot</text>
  <text x="460" y="276" font-size="15" fill="#6B7979">Good for full panels and</text>
  <text x="460" y="298" font-size="15" fill="#6B7979">people with mobility limits</text>
  <text x="460" y="360" font-size="15" font-weight="700" fill="#6B8E7F">Best for: full body</text>
  <text x="460" y="382" font-size="15" font-weight="700" fill="#6B8E7F">checkups, busy schedules</text>

  <text x="820" y="158" font-size="22" font-weight="700" fill="#2B3A3A">Hospital lab</text>
  <text x="820" y="192" font-size="15" fill="#6B7979">Attached to a consultation</text>
  <text x="820" y="220" font-size="15" fill="#6B7979">A doctor can act on results</text>
  <text x="820" y="248" font-size="15" fill="#6B7979">the same visit</text>
  <text x="820" y="276" font-size="15" fill="#6B7979">Often costs more than a</text>
  <text x="820" y="298" font-size="15" fill="#6B7979">standalone lab</text>
  <text x="820" y="326" font-size="15" fill="#6B7979">Wait times vary by facility</text>
  <text x="820" y="360" font-size="15" font-weight="700" fill="#6B8E7F">Best for: symptoms that</text>
  <text x="820" y="382" font-size="15" font-weight="700" fill="#6B8E7F">need a doctor's input</text>

  <text x="70" y="536" font-size="13" fill="#9AA6A6">General guidance. Availability, cost, and turnaround vary by facility. Confirm details when you book.</text>
</svg>
