<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="1200" height="350" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="70" y="46" font-size="30" font-weight="700" fill="#2B3A3A">Liver enzymes on a blood test</text>
  <text x="70" y="74" font-size="17" fill="#6B7979">A raised ALT, AST or GGT is often the first clue to fatty liver disease. Values are compared to the range your lab reports.</text>

  <!-- Column labels (above bars) -->
  <text x="300" y="100" font-size="16" font-weight="700" fill="#6B8E7F" text-anchor="middle">Normal zone</text>
  <text x="820" y="100" font-size="16" font-weight="700" fill="#C9594F" text-anchor="middle">Raised zone</text>

  <!-- Dividing tick reference line (ghost line at x=490 across all rows) -->
  <line x1="490" y1="106" x2="490" y2="314" stroke="#2B3A3A" stroke-width="1.5" stroke-dasharray="4 4" stroke-opacity="0.35"/>
  <text x="490" y="334" font-size="14" fill="#6B7979" text-anchor="middle">Typical normal limit (varies by lab and sex)</text>

  <!-- ALT bar -->
  <text x="98" y="140" font-size="20" font-weight="700" fill="#2B3A3A" text-anchor="end">ALT</text>
  <clipPath id="alt-clip"><rect x="108" y="112" width="1022" height="48" rx="11"/></clipPath>
  <g clip-path="url(#alt-clip)">
    <rect x="108" y="112" width="382" height="48" fill="#6B8E7F"/>
    <rect x="490" y="112" width="640" height="48" fill="#C9594F" fill-opacity="0.60"/>
  </g>
  <line x1="490" y1="108" x2="490" y2="164" stroke="#2B3A3A" stroke-width="2"/>

  <!-- AST bar -->
  <text x="98" y="218" font-size="20" font-weight="700" fill="#2B3A3A" text-anchor="end">AST</text>
  <clipPath id="ast-clip"><rect x="108" y="190" width="1022" height="48" rx="11"/></clipPath>
  <g clip-path="url(#ast-clip)">
    <rect x="108" y="190" width="382" height="48" fill="#6B8E7F"/>
    <rect x="490" y="190" width="640" height="48" fill="#C9594F" fill-opacity="0.60"/>
  </g>
  <line x1="490" y1="186" x2="490" y2="242" stroke="#2B3A3A" stroke-width="2"/>

  <!-- GGT bar (normal zone slightly wider; GGT upper limit is higher than ALT/AST) -->
  <text x="98" y="296" font-size="20" font-weight="700" fill="#2B3A3A" text-anchor="end">GGT</text>
  <clipPath id="ggt-clip"><rect x="108" y="268" width="1022" height="48" rx="11"/></clipPath>
  <g clip-path="url(#ggt-clip)">
    <rect x="108" y="268" width="382" height="48" fill="#6B8E7F"/>
    <rect x="490" y="268" width="640" height="48" fill="#C9594F" fill-opacity="0.60"/>
  </g>
  <line x1="490" y1="264" x2="490" y2="320" stroke="#2B3A3A" stroke-width="2"/>

  <!-- Source note -->
  <text x="70" y="346" font-size="13" fill="#9AA6A6">Source: AASLD and EASL clinical practice guidelines. ALT is the most liver-specific marker; AST and GGT provide supporting evidence. Always read your result against your own lab's reference range.</text>
</svg>
