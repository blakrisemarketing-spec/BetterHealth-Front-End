<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="1200" height="460" fill="#FFFFFF"/>
  <text x="70" y="56" font-size="30" font-weight="700" fill="#2B3A3A">Three ways to get a blood test in Durban</text>
  <text x="70" y="88" font-size="18" fill="#6B7979">Public hospital, private pathology lab, or a sample collected at home.</text>

  <!-- column dividers -->
  <line x1="410" y1="120" x2="410" y2="420" stroke="#E8E3DA" stroke-width="1"/>
  <line x1="790" y1="120" x2="790" y2="420" stroke="#E8E3DA" stroke-width="1"/>

  <!-- Column 1: Public hospital -->
  <circle cx="110" cy="150" r="10" fill="#6B8E7F"/>
  <text x="134" y="156" font-size="20" font-weight="700" fill="#2B3A3A">Public hospital</text>
  <text x="70" y="196" font-size="15" fill="#6B7979">Usually needs a doctor</text>
  <text x="70" y="218" font-size="15" fill="#6B7979">referral</text>
  <text x="70" y="252" font-size="15" fill="#6B7979">Walk-in, expect a queue at</text>
  <text x="70" y="274" font-size="15" fill="#6B7979">busy tertiary hospitals</text>
  <text x="70" y="308" font-size="15" fill="#6B7979">Often the most affordable</text>
  <text x="70" y="330" font-size="15" fill="#6B7979">route without medical aid</text>
  <text x="70" y="364" font-size="15" fill="#6B7979">Best for doctor-ordered tests</text>

  <!-- Column 2: Private pathology lab -->
  <circle cx="490" cy="150" r="10" fill="#6B8E7F"/>
  <text x="514" y="156" font-size="20" font-weight="700" fill="#2B3A3A">Private pathology lab</text>
  <text x="450" y="196" font-size="15" fill="#6B7979">Walk-in branches across</text>
  <text x="450" y="218" font-size="15" fill="#6B7979">the metro and coast</text>
  <text x="450" y="252" font-size="15" fill="#6B7979">Wider test menu, often</text>
  <text x="450" y="274" font-size="15" fill="#6B7979">quicker turnaround</text>
  <text x="450" y="308" font-size="15" fill="#6B7979">Billed to medical aid or</text>
  <text x="450" y="330" font-size="15" fill="#6B7979">paid out of pocket</text>
  <text x="450" y="364" font-size="15" fill="#6B7979">Best for routine screening</text>

  <!-- Column 3: Home sample collection -->
  <circle cx="870" cy="150" r="10" fill="#6B8E7F"/>
  <text x="894" y="156" font-size="20" font-weight="700" fill="#2B3A3A">Home sample collection</text>
  <text x="830" y="196" font-size="15" fill="#6B7979">Book online, a phlebotomist</text>
  <text x="830" y="218" font-size="15" fill="#6B7979">comes to you</text>
  <text x="830" y="252" font-size="15" fill="#6B7979">Saves the drive from areas</text>
  <text x="830" y="274" font-size="15" fill="#6B7979">like Umhlanga or Pinetown</text>
  <text x="830" y="308" font-size="15" fill="#6B7979">Results delivered digitally</text>
  <text x="830" y="330" font-size="15" fill="#6B7979">once processed</text>
  <text x="830" y="364" font-size="15" fill="#6B7979">Best for busy households</text>

  <line x1="70" y1="400" x2="1130" y2="400" stroke="#E8E3DA" stroke-width="1"/>
  <text x="1130" y="430" font-size="13" fill="#9AA6A6" text-anchor="end">General guidance only. Availability and cover vary, confirm details before booking.</text>
</svg>
