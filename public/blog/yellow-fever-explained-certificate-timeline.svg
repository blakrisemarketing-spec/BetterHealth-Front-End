<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Yellow fever timelines: vaccination and certificate versus an unvaccinated infection" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Vaccinate Once, Protected for Life: The Yellow Fever Certificate Timeline</title>
  <rect width="1200" height="600" fill="#FFFFFF"/>
  <text x="70" y="56" font-size="27" font-weight="700" fill="#2B3A3A">Vaccinate once, protected for life</text>
  <text x="70" y="86" font-size="16" fill="#6B7979">A single yellow fever vaccine dose, given at an approved centre, protects for life under current WHO rules.</text>

  <!-- Row 1: vaccinated path -->
  <text x="70" y="140" font-size="15" font-weight="700" letter-spacing="1" fill="#6B8E7F">IF VACCINATED</text>
  <line x1="150" y1="200" x2="950" y2="200" stroke="#D8DEDA" stroke-width="4"/>

  <circle cx="150" cy="200" r="36" fill="#E0A23E"/>
  <text x="150" y="192" text-anchor="middle" font-size="13" font-weight="700" fill="#2B3A3A">DAY</text>
  <text x="150" y="210" text-anchor="middle" font-size="17" font-weight="800" fill="#2B3A3A">0</text>
  <text x="150" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#2B3A3A">Single vaccine dose</text>
  <text x="150" y="282" text-anchor="middle" font-size="14" fill="#4B5A5A">at an NPHCDA-approved</text>
  <text x="150" y="302" text-anchor="middle" font-size="14" fill="#4B5A5A">centre</text>

  <circle cx="550" cy="200" r="36" fill="#6B8E7F"/>
  <text x="550" y="192" text-anchor="middle" font-size="13" font-weight="700" fill="#F5F3EE">DAY</text>
  <text x="550" y="212" text-anchor="middle" font-size="17" font-weight="800" fill="#F5F3EE">10</text>
  <text x="550" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#2B3A3A">Certificate becomes</text>
  <text x="550" y="282" text-anchor="middle" font-size="14" fill="#4B5A5A">valid for international</text>
  <text x="550" y="302" text-anchor="middle" font-size="14" fill="#4B5A5A">travel</text>

  <circle cx="950" cy="200" r="36" fill="#2B3A3A"/>
  <text x="950" y="196" text-anchor="middle" font-size="12" font-weight="700" fill="#F5F3EE">LIFE</text>
  <text x="950" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#F5F3EE">LONG</text>
  <text x="950" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#2B3A3A">One dose protects</text>
  <text x="950" y="282" text-anchor="middle" font-size="14" fill="#4B5A5A">for life, no booster</text>
  <text x="950" y="302" text-anchor="middle" font-size="14" fill="#4B5A5A">needed (WHO, 2016)</text>

  <!-- Row 2: unvaccinated / infection path -->
  <text x="70" y="380" font-size="15" font-weight="700" letter-spacing="1" fill="#C9594F">IF UNVACCINATED AND INFECTED</text>
  <line x1="120" y1="430" x2="1010" y2="430" stroke="#D8DEDA" stroke-width="4"/>

  <circle cx="120" cy="430" r="28" fill="#8E7FC9"/>
  <text x="120" y="435" text-anchor="middle" font-size="11" font-weight="800" fill="#F5F3EE">DAY 0</text>
  <text x="120" y="482" text-anchor="middle" font-size="13" font-weight="700" fill="#2B3A3A">Mosquito bite</text>

  <circle cx="410" cy="430" r="28" fill="#E0A23E"/>
  <text x="410" y="435" text-anchor="middle" font-size="10" font-weight="800" fill="#2B3A3A">DAY 3-6</text>
  <text x="410" y="482" text-anchor="middle" font-size="13" font-weight="700" fill="#2B3A3A">Symptoms begin</text>

  <circle cx="700" cy="430" r="28" fill="#C9594F"/>
  <text x="700" y="435" text-anchor="middle" font-size="12" font-weight="800" fill="#FBF0EE">~15%</text>
  <text x="700" y="482" text-anchor="middle" font-size="13" font-weight="700" fill="#2B3A3A">Toxic phase,</text>
  <text x="700" y="500" text-anchor="middle" font-size="13" font-weight="700" fill="#2B3A3A">urgent care</text>

  <circle cx="1000" cy="430" r="28" fill="#6B8E7F"/>
  <text x="1000" y="435" text-anchor="middle" font-size="11" font-weight="800" fill="#F5F3EE">MOST</text>
  <text x="1000" y="482" text-anchor="middle" font-size="13" font-weight="700" fill="#2B3A3A">Recover fully</text>

  <text x="70" y="572" font-size="13" fill="#9AA6A6">Source: WHO and NCDC guidance on yellow fever vaccination and the International Certificate of Vaccination or Prophylaxis. Individual cases vary; a clinician confirms diagnosis and treatment.</text>
</svg>
