<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-label="Hepatitis C test explained: what the antibody and RNA tests check for and what your result means" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Hepatitis C Test: Who Should Screen and What the Result Means</title>
  <defs>
    <radialGradient id="orb-hepc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6B8E7F" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#6B8E7F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="480" fill="#F5F3EE"/>
  <circle cx="1020" cy="150" r="320" fill="url(#orb-hepc)"/>

  <text x="90" y="172" font-size="22" font-weight="700" letter-spacing="3" fill="#6B8E7F">TESTING FOR CONDITIONS</text>
  <text x="86" y="252" font-size="54" font-weight="800" fill="#2B3A3A">Hepatitis C Test</text>
  <text x="90" y="304" font-size="26" fill="#6B7979">Who should screen, and what the result means</text>

  <rect x="90" y="344" width="150" height="42" rx="21" fill="#2B3A3A"/>
  <text x="165" y="371" text-anchor="middle" font-size="16" font-weight="700" fill="#F5F3EE">Anti-HCV</text>

  <rect x="254" y="344" width="120" height="42" rx="21" fill="#6B8E7F"/>
  <text x="314" y="371" text-anchor="middle" font-size="16" font-weight="700" fill="#F5F3EE">RNA test</text>

  <rect x="388" y="344" width="150" height="42" rx="21" fill="#E0A23E"/>
  <text x="463" y="371" text-anchor="middle" font-size="16" font-weight="700" fill="#2B3A3A">Curable</text>

  <!-- decorative shield with a check, suggesting cure/protection -->
  <path d="M 1030 130 L 1090 150 C 1090 210, 1070 250, 1030 275 C 990 250, 970 210, 970 150 Z" fill="#6B8E7F" opacity="0.22"/>
  <path d="M 1005 195 L 1022 212 L 1058 172" fill="none" stroke="#2B3A3A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
  <circle cx="1130" cy="200" r="6" fill="#2B3A3A" opacity="0.2"/>
  <circle cx="900" cy="260" r="5" fill="#2B3A3A" opacity="0.16"/>
