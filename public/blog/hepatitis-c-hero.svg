<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-label="Hepatitis C test explained: who should screen and what the result means" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Hepatitis C Test: Who Should Screen and What the Result Means</title>
  <defs>
    <radialGradient id="orb-hepc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6B8E7F" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#6B8E7F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="480" fill="#F5F3EE"/>
  <circle cx="1020" cy="150" r="320" fill="url(#orb-hepc)"/>

  <text x="90" y="172" font-size="22" font-weight="700" letter-spacing="3" fill="#6B8E7F">TESTING FOR CONDITIONS</text>
  <text x="86" y="252" font-size="54" font-weight="800" fill="#2B3A3A">Hepatitis C Test</text>
  <text x="90" y="304" font-size="26" fill="#6B7979">Who should screen, and what the result means</text>

  <rect x="90" y="344" width="150" height="42" rx="21" fill="#2B3A3A"/>
  <text x="165" y="371" text-anchor="middle" font-size="16" font-weight="700" fill="#F5F3EE">Anti-HCV</text>

  <rect x="254" y="344" width="130" height="42" rx="21" fill="#D97B4F"/>
  <text x="319" y="371" text-anchor="middle" font-size="16" font-weight="700" fill="#F5F3EE">HCV RNA</text>

  <rect x="398" y="344" width="110" height="42" rx="21" fill="#6B8E7F"/>
  <text x="453" y="371" text-anchor="middle" font-size="16" font-weight="700" fill="#F5F3EE">Curable</text>

  <!-- decorative pill/tablet motif suggesting curative antiviral treatment -->
  <g transform="translate(1000,190) rotate(-24)">
    <rect x="-58" y="-24" width="116" height="48" rx="24" fill="#D97B4F" opacity="0.85"/>
    <rect x="-58" y="-24" width="58" height="48" rx="24" fill="#2B3A3A" opacity="0.55"/>
    <line x1="0" y1="-24" x2="0" y2="24" stroke="#F5F3EE" stroke-width="2" opacity="0.6"/>
  </g>
  <circle cx="1130" cy="120" r="6" fill="#2B3A3A" opacity="0.18"/>
  <circle cx="900" cy="260" r="5" fill="#2B3A3A" opacity="0.16"/>
  <circle cx="1080" cy="290" r="4" fill="#2B3A3A" opacity="0.16"/>
</svg>
