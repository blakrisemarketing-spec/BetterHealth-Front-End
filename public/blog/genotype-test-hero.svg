<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6B8E7F" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#6B8E7F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="480" fill="#F5F3EE"/>
  <circle cx="1010" cy="150" r="320" fill="url(#orb)"/>

  <text x="90" y="172" font-size="22" font-weight="700" letter-spacing="3" fill="#6B8E7F">FAMILY PLANNING</text>
  <text x="86" y="252" font-size="52" font-weight="800" fill="#2B3A3A">Genotype: AA, AS, SS</text>
  <text x="90" y="292" font-size="26" fill="#6B7979">What your haemoglobin result means before marriage.</text>

  <g font-size="19" font-weight="700" fill="#FFFFFF">
    <rect x="90" y="340" width="150" height="52" rx="26" fill="#6B8E7F"/>
    <text x="165" y="373" text-anchor="middle">AA safe</text>

    <rect x="258" y="340" width="190" height="52" rx="26" fill="#6B8E7F"/>
