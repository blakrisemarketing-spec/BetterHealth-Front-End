<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6B8E7F" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#6B8E7F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="480" fill="#F5F3EE"/>
  <circle cx="1010" cy="150" r="320" fill="url(#orb)"/>

  <text x="90" y="150" font-size="22" font-weight="700" letter-spacing="3" fill="#6B8E7F">UNDERSTANDING YOUR CONDITIONS</text>
  <text x="86" y="228" font-size="54" font-weight="800" fill="#2B3A3A">Know your genotype</text>
  <text x="86" y="290" font-size="54" font-weight="800" fill="#2B3A3A">before you marry</text>
  <text x="90" y="336" font-size="24" fill="#6B7979">What AA, AS and SS mean, and why genotype compatibility matters.</text>

  <!-- genotype pill badges -->
  <g font-size="22" font-weight="700" fill="#2B3A3A">
    <rect x="90" y="370" width="120" height="52" rx="26" fill="#EAF1EC" stroke="#6B8E7F" stroke-width="2"/>
    <text x="150" y="404" text-anchor="middle">AA</text>

    <rect x="226" y="370" width="120" height="52" rx="26" fill="#F3EEDF" stroke="#E0A23E" stroke-width="2"/>
    <text x="286" y="404" text-anchor="middle">AS</text>

    <rect x="362" y="370" width="120" height="52" rx="26" fill="#F6E3E0" stroke="#C9594F" stroke-width="2"/>
    <text x="422" y="404" text-anchor="middle">SS</text>

    <rect x="498" y="370" width="120" height="52" rx="26" fill="#EDEAF6" stroke="#8E7FC9" stroke-width="2"/>
    <text x="558" y="404" text-anchor="middle">SC</text>
  </g>
</svg>
