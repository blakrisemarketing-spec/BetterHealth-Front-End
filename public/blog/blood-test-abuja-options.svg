<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="1200" height="550" fill="#FFFFFF"/>
  <text x="70" y="56" font-size="30" font-weight="700" fill="#2B3A3A">Three ways to get a blood test in Abuja</text>
  <text x="70" y="88" font-size="18" fill="#6B7979">The right option depends on urgency, distance between districts, and whether a doctor ordered the test.</text>

  <!-- Column 1: Public hospital lab -->
  <rect x="60" y="120" width="340" height="390" rx="18" fill="#F1F4F2"/>
  <circle cx="110" cy="170" r="10" fill="#6B8E7F"/>
  <text x="134" y="176" font-size="20" font-weight="700" fill="#2B3A3A">Public hospital lab</text>
  <text x="90" y="216" font-size="15" fill="#6B7979">Usually needs a doctor</text>
  <text x="90" y="238" font-size="15" fill="#6B7979">consultation first</text>
  <text x="90" y="272" font-size="15" fill="#6B7979">Walk-in, expect a queue</text>
  <text x="90" y="306" font-size="15" fill="#6B7979">Handles almost any test</text>
  <text x="90" y="328" font-size="15" fill="#6B7979">a doctor orders</text>
  <text x="90" y="362" font-size="15" fill="#6B7979">Often the default when</text>
  <text x="90" y="384" font-size="15" fill="#6B7979">already seeing a doctor</text>
  <text x="90" y="406" font-size="15" fill="#6B7979">for a specific complaint</text>
  <text x="90" y="440" font-size="15" fill="#6B7979">Best for doctor-ordered</text>
  <text x="90" y="462" font-size="15" fill="#6B7979">or urgent tests</text>

  <!-- Column 2: Private diagnostic lab -->
  <rect x="430" y="120" width="340" height="390" rx="18" fill="#EDEAF6"/>
  <circle cx="480" cy="170" r="10" fill="#8E7FC9"/>
  <text x="504" y="176" font-size="20" font-weight="700" fill="#2B3A3A">Private diagnostic lab</text>
  <text x="460" y="216" font-size="15" fill="#6B7979">Walk-in, no referral</text>
  <text x="460" y="238" font-size="15" fill="#6B7979">usually needed</text>
  <text x="460" y="272" font-size="15" fill="#6B7979">Published test menu you</text>
  <text x="460" y="294" font-size="15" fill="#6B7979">can request directly</text>
  <text x="460" y="328" font-size="15" fill="#6B7979">Suits people who already</text>
  <text x="460" y="350" font-size="15" fill="#6B7979">know what to check</text>
  <text x="460" y="384" font-size="15" fill="#6B7979">Paid out of pocket, price</text>
  <text x="460" y="406" font-size="15" fill="#6B7979">varies by lab and panel</text>
  <text x="460" y="440" font-size="15" fill="#6B7979">Found across Garki, Wuse</text>
  <text x="460" y="462" font-size="15" fill="#6B7979">and other central districts</text>

  <!-- Column 3: Home sample collection -->
  <rect x="800" y="120" width="340" height="390" rx="18" fill="#FBF0EE"/>
  <circle cx="850" cy="170" r="10" fill="#C9594F"/>
  <text x="874" y="176" font-size="20" font-weight="700" fill="#2B3A3A">Home sample collection</text>
  <text x="830" y="216" font-size="15" fill="#6B7979">Book online, phlebotomist</text>
  <text x="830" y="238" font-size="15" fill="#6B7979">comes to you</text>
  <text x="830" y="272" font-size="15" fill="#6B7979">No travel or waiting room</text>
  <text x="830" y="306" font-size="15" fill="#6B7979">Avoids cross-district</text>
  <text x="830" y="328" font-size="15" fill="#6B7979">commute time</text>
  <text x="830" y="362" font-size="15" fill="#6B7979">Sample still travels to an</text>
  <text x="830" y="384" font-size="15" fill="#6B7979">accredited lab for processing</text>
  <text x="830" y="440" font-size="15" fill="#6B7979">Good fit for busy</text>
  <text x="830" y="462" font-size="15" fill="#6B7979">schedules or households</text>

  <line x1="70" y1="530" x2="1130" y2="530" stroke="#E8E3DA" stroke-width="1"/>
  <text x="1130" y="546" font-size="13" fill="#9AA6A6" text-anchor="end">Availability and current pricing vary. Confirm details before booking.</text>
</svg>
