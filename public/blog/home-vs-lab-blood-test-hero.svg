<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6B8E7F" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#6B8E7F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="480" fill="#F5F3EE"/>
  <circle cx="1010" cy="150" r="320" fill="url(#orb)"/>

  <text x="90" y="150" font-size="22" font-weight="700" letter-spacing="3" fill="#6B8E7F">CHOOSING HOW TO TEST</text>
  <text x="86" y="222" font-size="54" font-weight="800" fill="#2B3A3A">Home draw or lab visit?</text>
  <text x="86" y="266" font-size="54" font-weight="800" fill="#2B3A3A">Same lab, different door.</text>
  <text x="90" y="312" font-size="26" fill="#6B7979">The sample travels to the same accredited lab either way.</text>

  <!-- two simple icons: house and building, connected to one lab node -->
  <g transform="translate(120,360)">
    <rect x="0" y="20" width="70" height="50" rx="6" fill="#FFFFFF" stroke="#6B8E7F" stroke-width="3"/>
    <path d="M -8 24 L 35 -6 L 78 24" fill="none" stroke="#6B8E7F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="-6" y="96" font-size="16" fill="#6B7979">Home draw</text>
  </g>

  <g transform="translate(300,360)">
    <rect x="0" y="0" width="60" height="70" rx="4" fill="#FFFFFF" stroke="#D97B4F" stroke-width="3"/>
    <rect x="12" y="14" width="10" height="10" fill="#D97B4F"/>
    <rect x="38" y="14" width="10" height="10" fill="#D97B4F"/>
    <rect x="12" y="34" width="10" height="10" fill="#D97B4F"/>
    <rect x="38" y="34" width="10" height="10" fill="#D97B4F"/>
    <text x="-14" y="96" font-size="16" fill="#6B7979">Walk-in lab</text>
  </g>

  <path d="M 195 388 C 260 350, 340 350, 400 355" fill="none" stroke="#6B8E7F" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
  <path d="M 365 388 C 400 360, 420 355, 440 352" fill="none" stroke="#D97B4F" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>

  <g transform="translate(460,352)">
    <rect x="0" y="0" width="90" height="60" rx="10" fill="#EEF3EF" stroke="#6B8E7F" stroke-width="2"/>
    <text x="16" y="26" font-size="14" font-weight="700" fill="#2B3A3A">Same</text>
    <text x="16" y="46" font-size="14" font-weight="700" fill="#2B3A3A">accredited lab</text>
  </g>
</svg>
