<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="1200" height="480" fill="#FFFFFF"/>
  <text x="70" y="66" font-size="34" font-weight="700" fill="#2B3A3A">Foods higher vs lower in purines</text>
  <text x="70" y="100" font-size="20" fill="#6B7979">A general guide, not a strict rulebook. Portion and frequency matter too.</text>

  <!-- Higher in purines column -->
  <g>
    <rect x="70" y="140" width="500" height="46" rx="10" fill="#C9594F" fill-opacity="0.14"/>
    <text x="94" y="170" font-size="22" font-weight="700" fill="#C9594F">Higher in purines (limit)</text>

    <text x="94" y="222" font-size="19" fill="#2B3A3A">Organ meat (liver, kidney)</text>
    <text x="94" y="258" font-size="19" fill="#2B3A3A">Red meat, in large portions</text>
    <text x="94" y="294" font-size="19" fill="#2B3A3A">Shellfish (shrimp, crab, sardines)</text>
    <text x="94" y="330" font-size="19" fill="#2B3A3A">Beer and other alcohol</text>
    <text x="94" y="366" font-size="19" fill="#2B3A3A">Sugary drinks high in fructose</text>
  </g>

  <!-- Lower in purines column -->
  <g>
    <rect x="630" y="140" width="500" height="46" rx="10" fill="#6B8E7F" fill-opacity="0.16"/>
    <text x="654" y="170" font-size="22" font-weight="700" fill="#6B8E7F">Lower in purines (generally fine)</text>

    <text x="654" y="222" font-size="19" fill="#2B3A3A">Vegetables, including most beans</text>
    <text x="654" y="258" font-size="19" fill="#2B3A3A">Whole grains and starches</text>
    <text x="654" y="294" font-size="19" fill="#2B3A3A">Low-fat dairy</text>
    <text x="654" y="330" font-size="19" fill="#2B3A3A">Eggs</text>
    <text x="654" y="366" font-size="19" fill="#2B3A3A">Water, in place of sugary drinks</text>
  </g>

  <line x1="600" y1="140" x2="600" y2="386" stroke="#E5E1D8" stroke-width="2"/>
  <text x="70" y="430" font-size="15" fill="#9AA6A6">General dietary guidance, not medical treatment. Ask your doctor about your own diet plan.</text>
</svg>
