<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-label="H. pylori explained: the bacterium behind most stomach ulcers" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>H. pylori: The Bacterium Behind Most Stomach Ulcers</title>
  <defs>
    <radialGradient id="orb-hpylori" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6B8E7F" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#6B8E7F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="480" fill="#F5F3EE"/>
  <circle cx="1010" cy="150" r="320" fill="url(#orb-hpylori)"/>

  <text x="90" y="172" font-size="22" font-weight="700" letter-spacing="3" fill="#6B8E7F">TESTING FOR CONDITIONS</text>
  <text x="86" y="248" font-size="52" font-weight="800" fill="#2B3A3A">H. pylori, explained</text>
  <text x="90" y="298" font-size="26" fill="#6B7979">The bacterium behind most stomach ulcers</text>

  <rect x="90" y="336" width="220" height="42" rx="21" fill="#2B3A3A"/>
  <text x="200" y="363" text-anchor="middle" font-size="16" font-weight="700" fill="#F5F3EE">Stool antigen test</text>

  <rect x="326" y="336" width="180" height="42" rx="21" fill="#6B8E7F"/>
  <text x="416" y="363" text-anchor="middle" font-size="16" font-weight="700" fill="#F5F3EE">Breath test</text>

  <rect x="522" y="336" width="230" height="42" rx="21" fill="#E0A23E"/>
  <text x="637" y="363" text-anchor="middle" font-size="16" font-weight="700" fill="#2B3A3A">Multi-drug treatment</text>

  <!-- stylised spiral bacterium motif -->
  <g transform="translate(970,250)" opacity="0.85">
    <path d="M -70 0 C -55 -60, -15 -60, 0 0 C 15 60, 55 60, 70 0" fill="none" stroke="#6B8E7F" stroke-width="10" stroke-linecap="round" opacity="0.55"/>
    <path d="M -70 40 C -55 -20, -15 -20, 0 40 C 15 100, 55 100, 70 40" fill="none" stroke="#2B3A3A" stroke-width="8" stroke-linecap="round" opacity="0.18"/>
  </g>
  <circle cx="1090" cy="160" r="6" fill="#2B3A3A" opacity="0.2"/>
  <circle cx="1130" cy="220" r="5" fill="#2B3A3A" opacity="0.16"/>
</svg>
