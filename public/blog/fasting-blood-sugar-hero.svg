<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="Fasting blood sugar test: what the number on your glucose meter means">
  <title>Fasting Blood Sugar Test Explained</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
    <linearGradient id="meterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#0F2240"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="url(#bgGrad)" rx="16"/>

  <!-- Left: Glucose meter illustration -->
  <g transform="translate(80, 60)">
    <!-- Meter body -->
    <rect x="0" y="0" width="180" height="300" rx="22" fill="url(#meterGrad)"/>
    <!-- Screen -->
    <rect x="18" y="20" width="144" height="100" rx="8" fill="url(#screenGrad)"/>
    <!-- Reading on screen -->
    <text x="90" y="68" text-anchor="middle" font-family="'Courier New', monospace" font-size="40" font-weight="bold" fill="#22C55E">5.2</text>
    <text x="90" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#86EFAC">mmol/L</text>
    <!-- Label below screen -->
    <text x="90" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#9CA3AF">FASTING GLUCOSE</text>
    <!-- Strip slot -->
    <rect x="60" y="155" width="60" height="12" rx="4" fill="#374151"/>
    <rect x="72" y="151" width="36" height="4" rx="2" fill="#FDE68A"/>
    <!-- Buttons -->
    <circle cx="50" cy="200" r="14" fill="#374151"/>
    <circle cx="90" cy="200" r="14" fill="#374151"/>
    <circle cx="130" cy="200" r="14" fill="#374151"/>
    <text x="50" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#9CA3AF">M</text>
    <text x="90" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#9CA3AF">OK</text>
    <text x="130" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#9CA3AF">C</text>
    <!-- Bottom port -->
    <rect x="60" y="268" width="60" height="16" rx="4" fill="#374151"/>
    <!-- Brand area -->
    <text x="90" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">BetterHealth</text>
  </g>

  <!-- Right: Labels and explanation -->
  <g transform="translate(320, 60)">
    <!-- Heading -->
    <text x="0" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#14532D">Fasting Blood Sugar</text>
    <text x="0" y="80" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#166534">What the number on your</text>
    <text x="0" y="108" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#166534">glucose test actually means</text>

    <!-- Key fact boxes -->
    <g transform="translate(0, 140)">
      <rect x="0" y="0" width="200" height="72" rx="10" fill="#FFFFFF" opacity="0.85"/>
      <text x="16" y="24" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#15803D">Normal range</text>
      <text x="16" y="44" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#166534">Below 5.6 mmol/L</text>
      <text x="16" y="62" font-family="Arial, sans-serif" font-size="11" fill="#6B7280">WHO / ADA threshold</text>
    </g>

    <g transform="translate(220, 140)">
      <rect x="0" y="0" width="200" height="72" rx="10" fill="#FFFFFF" opacity="0.85"/>
      <text x="16" y="24" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#92400E">Prediabetes range</text>
      <text x="16" y="44" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#92400E">5.6 to 6.9 mmol/L</text>
      <text x="16" y="62" font-family="Arial, sans-serif" font-size="11" fill="#6B7280">Impaired fasting glucose</text>
    </g>

    <g transform="translate(0, 236)">
      <rect x="0" y="0" width="200" height="72" rx="10" fill="#FFFFFF" opacity="0.85"/>
      <text x="16" y="24" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#DC2626">Diabetes range</text>
      <text x="16" y="44" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#DC2626">7.0 mmol/L or higher</text>
      <text x="16" y="62" font-family="Arial, sans-serif" font-size="11" fill="#6B7280">Confirmed on a second test</text>
    </g>

    <g transform="translate(220, 236)">
      <rect x="0" y="0" width="200" height="72" rx="10" fill="#FFFFFF" opacity="0.85"/>
      <text x="16" y="24" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1D4ED8">Fast required</text>
      <text x="16" y="44" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1E40AF">8 hours</text>
      <text x="16" y="62" font-family="Arial, sans-serif" font-size="11" fill="#6B7280">No food before the test</text>
    </g>
  </g>

  <!-- Footer label -->
  <text x="400" y="406" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6B7280">Sources: WHO Definition and Diagnosis of Diabetes Mellitus 2006; ADA Standards of Medical Care 2024</text>
</svg>
