<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="1200" height="460" fill="#FFFFFF"/>
  <text x="70" y="56" font-size="30" font-weight="700" fill="#2B3A3A">Typical ALT and AST reference ranges</text>
  <text x="70" y="88" font-size="18" fill="#6B7979">Both usually rise together when the liver is under strain. Exact cutoffs vary by lab.</text>

  <rect x="70" y="118" width="16" height="16" rx="3" fill="#2B3A3A"/>
  <text x="98" y="131" font-size="16" font-weight="700" fill="#2B3A3A">ALT</text>
  <text x="180" y="131" font-size="16" fill="#6B7979">about 7 to 56 U/L</text>

  <rect x="70" y="146" width="16" height="16" rx="3" fill="#6B8E7F"/>
  <text x="98" y="159" font-size="16" font-weight="700" fill="#2B3A3A">AST</text>
  <text x="180" y="159" font-size="16" fill="#6B7979">about 10 to 40 U/L</text>

  <rect x="70" y="174" width="16" height="16" rx="3" fill="#E0A23E"/>
  <text x="98" y="187" font-size="16" font-weight="700" fill="#2B3A3A">GGT</text>
  <text x="180" y="187" font-size="16" fill="#6B7979">typically under about 50 U/L</text>

  <line x1="70" y1="214" x2="1130" y2="214" stroke="#E8E3DA" stroke-width="1"/>

  <text x="70" y="250" font-size="22" font-weight="700" fill="#2B3A3A">AST:ALT ratio, a clue to the cause</text>

  <rect x="70" y="270" width="480" height="46" rx="10" fill="#F5F3EE"/>
  <text x="90" y="298" font-size="16" font-weight="700" fill="#2B3A3A">ALT higher than AST</text>
  <text x="330" y="298" font-size="15" fill="#6B7979">fatty liver, most viral hepatitis</text>

  <rect x="70" y="326" width="480" height="46" rx="10" fill="#F5F3EE"/>
  <text x="90" y="354" font-size="16" font-weight="700" fill="#2B3A3A">AST:ALT ratio above 2</text>
  <text x="330" y="354" font-size="15" fill="#6B7979">can suggest alcohol-related damage</text>

  <text x="70" y="410" font-size="15" fill="#6B7979">The ratio is one clue among several; it never confirms a diagnosis alone.</text>
  <text x="70" y="436" font-size="13" fill="#9AA6A6">Reference ranges vary by lab and method. Confirm the interval on your own report.</text>
</svg>
