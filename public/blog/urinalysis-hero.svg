<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6B8E7F" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#6B8E7F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="480" fill="#F5F3EE"/>
  <circle cx="1010" cy="150" r="320" fill="url(#orb)"/>

  <text x="90" y="150" font-size="22" font-weight="700" letter-spacing="3" fill="#6B8E7F">UNDERSTANDING YOUR BIOMARKERS</text>
  <text x="86" y="240" font-size="58" font-weight="800" fill="#2B3A3A">Urinalysis, in plain language</text>
  <text x="90" y="284" font-size="25" fill="#6B7979">What a routine urine test checks, from protein to leukocytes.</text>

  <!-- test strip / dipstick illustration -->
  <g transform="translate(150,330)">
    <rect x="0" y="0" width="360" height="46" rx="10" fill="#EFE9DD" stroke="#D8D0C0" stroke-width="2"/>
    <text x="14" y="30" font-size="16" font-weight="700" fill="#6B7979">DIPSTICK</text>
    <rect x="140" y="6" width="34" height="34" rx="6" fill="#6B8E7F"/>
    <rect x="182" y="6" width="34" height="34" rx="6" fill="#8FAE9E"/>
    <rect x="224" y="6" width="34" height="34" rx="6" fill="#C9594F" opacity="0.75"/>
    <rect x="266" y="6" width="34" height="34" rx="6" fill="#E0A23E" opacity="0.85"/>
    <rect x="308" y="6" width="34" height="34" rx="6" fill="#6B8E7F" opacity="0.55"/>
  </g>

  <!-- small labels under each pad -->
  <g font-size="14" fill="#9AA6A6" text-anchor="middle">
    <text x="307" y="404">Protein</text>
    <text x="349" y="404">Glucose</text>
    <text x="391" y="404">Blood</text>
    <text x="433" y="404">WBC</text>
    <text x="475" y="404">Nitrite</text>
  </g>

  <!-- container / sample cup -->
  <g transform="translate(600,320)">
    <path d="M0 0 L70 0 L58 90 Q35 100 12 90 Z" fill="#FFFFFF" stroke="#D8D0C0" stroke-width="2.5"/>
    <path d="M6 26 L64 26 L58 90 Q35 100 12 90 Z" fill="#E0A23E" opacity="0.35"/>
    <line x1="10" y1="26" x2="60" y2="26" stroke="#D8D0C0" stroke-width="1.5"/>
  </g>
  <text x="600" y="440" font-size="14" fill="#9AA6A6">Midstream clean-catch sample</text>
</svg>
