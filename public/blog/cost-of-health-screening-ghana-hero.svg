<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6B8E7F" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#6B8E7F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="480" fill="#F5F3EE"/>
  <circle cx="1010" cy="150" r="320" fill="url(#orb)"/>

  <text x="90" y="140" font-size="22" font-weight="700" letter-spacing="3" fill="#6B8E7F">BUDGETING FOR A HEALTH CHECK</text>
  <text x="86" y="216" font-size="54" font-weight="800" fill="#2B3A3A">What decides the cost</text>
  <text x="86" y="272" font-size="54" font-weight="800" fill="#2B3A3A">of a health check in Ghana</text>
  <text x="90" y="316" font-size="24" fill="#6B7979">Panel size, provider type and how the sample is taken, explained.</text>

  <!-- simple balanced scale motif, no numbers -->
  <g stroke="#6B8E7F" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="1000" y1="360" x2="1000" y2="410"/>
    <line x1="900" y1="410" x2="1100" y2="410"/>
    <line x1="1000" y1="360" x2="920" y2="360"/>
    <line x1="1000" y1="360" x2="1080" y2="360"/>
    <path d="M 890 360 A 30 30 0 0 0 950 360"/>
    <path d="M 1050 360 A 30 30 0 0 0 1110 360"/>
  </g>
  <circle cx="1000" cy="352" r="10" fill="#6B8E7F"/>
</svg>
