<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Blood pressure gauge showing high blood pressure range with the label 'The Silent Killer'">
  <!-- Background -->
  <rect width="800" height="400" fill="#F0F7FF" rx="16"/>

  <!-- Card panel -->
  <rect x="40" y="32" width="720" height="336" rx="12" fill="#FFFFFF" stroke="#E2ECF8" stroke-width="1.5"/>

  <!-- Headline text -->
  <text x="400" y="76" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#1A2F4E" text-anchor="middle">High Blood Pressure</text>
  <text x="400" y="104" font-family="Georgia, serif" font-size="16" fill="#4A6A8A" text-anchor="middle">Why most people don't know they have it</text>

  <!-- Gauge arc background (half circle) -->
  <path d="M 160 280 A 140 140 0 0 1 440 280" fill="none" stroke="#E8EEF5" stroke-width="32" stroke-linecap="round"/>

  <!-- Colour zones on gauge -->
  <!-- Normal: green zone ~0 to 60deg -->
  <path d="M 160 280 A 140 140 0 0 1 230 157" fill="none" stroke="#22C55E" stroke-width="32" stroke-linecap="butt"/>
  <!-- Elevated: yellow ~60 to 100deg -->
  <path d="M 230 157 A 140 140 0 0 1 300 140" fill="none" stroke="#EAB308" stroke-width="32" stroke-linecap="butt"/>
  <!-- Stage 1: orange ~100 to 140deg -->
  <path d="M 300 140 A 140 140 0 0 1 370 155" fill="none" stroke="#F97316" stroke-width="32" stroke-linecap="butt"/>
  <!-- Stage 2: red ~140 to 180deg -->
  <path d="M 370 155 A 140 140 0 0 1 440 280" fill="none" stroke="#EF4444" stroke-width="32" stroke-linecap="round"/>

  <!-- Gauge needle pointing to Stage 2 area -->
  <line x1="300" y1="280" x2="390" y2="172" stroke="#1A2F4E" stroke-width="4" stroke-linecap="round"/>
  <circle cx="300" cy="280" r="8" fill="#1A2F4E"/>

  <!-- Gauge labels -->
  <text x="148" y="306" font-family="Arial, sans-serif" font-size="11" fill="#22C55E" text-anchor="middle">Normal</text>
  <text x="210" y="145" font-family="Arial, sans-serif" font-size="11" fill="#EAB308" text-anchor="middle">Elevated</text>
  <text x="305" y="124" font-family="Arial, sans-serif" font-size="11" fill="#F97316" text-anchor="middle">Stage 1</text>
  <text x="420" y="150" font-family="Arial, sans-serif" font-size="11" fill="#EF4444" text-anchor="middle">Stage 2</text>

  <!-- BP reading bubble -->
  <rect x="260" y="296" width="80" height="36" rx="8" fill="#1A2F4E"/>
  <text x="300" y="318" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">≥140/90</text>

  <!-- Right side: key facts panel -->
  <rect x="480" y="80" width="252" height="220" rx="10" fill="#F8FAFD" stroke="#E2ECF8" stroke-width="1"/>

  <text x="606" y="108" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1A2F4E" text-anchor="middle">Key facts — Ghana</text>

  <!-- Fact rows -->
  <circle cx="506" cy="136" r="4" fill="#0EA5E9"/>
  <text x="518" y="140" font-family="Arial, sans-serif" font-size="12" fill="#2D4A6B">~30% of adults affected</text>

  <circle cx="506" cy="160" r="4" fill="#0EA5E9"/>
  <text x="518" y="164" font-family="Arial, sans-serif" font-size="12" fill="#2D4A6B">Most cases undiagnosed</text>

  <circle cx="506" cy="184" r="4" fill="#0EA5E9"/>
  <text x="518" y="188" font-family="Arial, sans-serif" font-size="12" fill="#2D4A6B">No symptoms in early stages</text>

  <circle cx="506" cy="208" r="4" fill="#0EA5E9"/>
  <text x="518" y="212" font-family="Arial, sans-serif" font-size="12" fill="#2D4A6B">Damages heart, kidneys, brain</text>

  <circle cx="506" cy="232" r="4" fill="#0EA5E9"/>
  <text x="518" y="236" font-family="Arial, sans-serif" font-size="12" fill="#2D4A6B">A single BP reading takes 2 min</text>

  <circle cx="506" cy="256" r="4" fill="#0EA5E9"/>
  <text x="518" y="260" font-family="Arial, sans-serif" font-size="12" fill="#2D4A6B">Lifestyle change can reverse it</text>

  <!-- Source note -->
  <text x="400" y="352" font-family="Arial, sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Sources: WHO Global Hypertension Report 2023 · Ghana Health Service national surveys 2020–2023</text>

  <!-- BetterHealth Africa badge -->
  <text x="400" y="372" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#0EA5E9" text-anchor="middle">BetterHealth Africa</text>
</svg>
