<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6B8E7F" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#6B8E7F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="480" fill="#F5F3EE"/>
  <circle cx="1010" cy="150" r="320" fill="url(#orb)"/>

  <text x="90" y="172" font-size="22" font-weight="700" letter-spacing="3" fill="#6B8E7F">SCREENING &#183; WOMEN'S HEALTH</text>
  <text x="86" y="252" font-size="50" font-weight="800" fill="#2B3A3A">Breast cancer screening,</text>
  <text x="86" y="312" font-size="50" font-weight="800" fill="#2B3A3A">three ways to catch it early</text>
  <text x="90" y="358" font-size="24" fill="#6B7979">Self-awareness, a clinical exam, and a mammogram when it's time.</text>

  <!-- three pill badges representing the three approaches -->
  <g font-size="17" font-weight="700">
    <rect x="90" y="392" width="196" height="46" rx="23" fill="#FFFFFF" stroke="#6B8E7F" stroke-width="2"/>
    <text x="188" y="421" fill="#2B3A3A" text-anchor="middle">Self-exam</text>

    <rect x="300" y="392" width="220" height="46" rx="23" fill="#FFFFFF" stroke="#6B8E7F" stroke-width="2"/>
    <text x="410" y="421" fill="#2B3A3A" text-anchor="middle">Clinical exam</text>

    <rect x="534" y="392" width="200" height="46" rx="23" fill="#6B8E7F"/>
    <text x="634" y="421" fill="#FFFFFF" text-anchor="middle">Mammogram</text>
  </g>

  <!-- abstract concentric rings motif, top-right, echoing checking for changes -->
  <circle cx="1050" cy="300" r="54" fill="none" stroke="#6B8E7F" stroke-width="3" stroke-opacity="0.45"/>
  <circle cx="1050" cy="300" r="34" fill="none" stroke="#6B8E7F" stroke-width="3" stroke-opacity="0.35"/>
  <circle cx="1050" cy="300" r="14" fill="#6B8E7F" fill-opacity="0.4"/>
  <circle cx="1140" cy="260" r="18" fill="none" stroke="#6B8E7F" stroke-width="2.5" stroke-opacity="0.3"/>
</svg>
