<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="1200" height="820" fill="#FFFFFF"/>
  <text x="70" y="58" font-size="30" font-weight="700" fill="#2B3A3A">What a urine test panel checks</text>
  <text x="70" y="90" font-size="18" fill="#6B7979">Seven markers on a routine dipstick urinalysis, and what a normal result looks like</text>

  <!-- Row template: name/desc left, status chip right -->
  <!-- Row 1: Protein -->
  <line x1="70" y1="118" x2="1130" y2="118" stroke="#E8E3DA" stroke-width="1"/>
  <text x="70" y="152" font-size="20" font-weight="700" fill="#2B3A3A">Protein</text>
  <text x="70" y="174" font-size="15" fill="#6B7979">Early flag for possible kidney damage</text>
  <rect x="870" y="134" width="190" height="34" rx="17" fill="#E4EDE8"/>
  <text x="965" y="157" font-size="16" font-weight="700" fill="#4C6B5D" text-anchor="middle">Negative / trace</text>

  <!-- Row 2: Glucose -->
  <line x1="70" y1="196" x2="1130" y2="196" stroke="#E8E3DA" stroke-width="1"/>
  <text x="70" y="230" font-size="20" font-weight="700" fill="#2B3A3A">Glucose</text>
  <text x="70" y="252" font-size="15" fill="#6B7979">Sugar spilling into urine, linked to diabetes</text>
  <rect x="870" y="212" width="190" height="34" rx="17" fill="#E4EDE8"/>
  <text x="965" y="235" font-size="16" font-weight="700" fill="#4C6B5D" text-anchor="middle">Negative</text>

  <!-- Row 3: Blood -->
  <line x1="70" y1="274" x2="1130" y2="274" stroke="#E8E3DA" stroke-width="1"/>
  <text x="70" y="308" font-size="20" font-weight="700" fill="#2B3A3A">Blood</text>
  <text x="70" y="330" font-size="15" fill="#6B7979">Haematuria: from infection to kidney stones</text>
  <rect x="870" y="290" width="190" height="34" rx="17" fill="#E4EDE8"/>
  <text x="965" y="313" font-size="16" font-weight="700" fill="#4C6B5D" text-anchor="middle">Negative</text>

  <!-- Row 4: Leukocytes -->
  <line x1="70" y1="352" x2="1130" y2="352" stroke="#E8E3DA" stroke-width="1"/>
  <text x="70" y="386" font-size="20" font-weight="700" fill="#2B3A3A">Leukocytes (WBC)</text>
  <text x="70" y="408" font-size="15" fill="#6B7979">White cells; raised with infection or inflammation</text>
  <rect x="870" y="368" width="190" height="34" rx="17" fill="#E4EDE8"/>
  <text x="965" y="391" font-size="16" font-weight="700" fill="#4C6B5D" text-anchor="middle">Negative</text>

  <!-- Row 5: Nitrites -->
  <line x1="70" y1="430" x2="1130" y2="430" stroke="#E8E3DA" stroke-width="1"/>
  <text x="70" y="464" font-size="20" font-weight="700" fill="#2B3A3A">Nitrites</text>
  <text x="70" y="486" font-size="15" fill="#6B7979">Produced by bacteria; supports a UTI flag</text>
  <rect x="870" y="446" width="190" height="34" rx="17" fill="#E4EDE8"/>
  <text x="965" y="469" font-size="16" font-weight="700" fill="#4C6B5D" text-anchor="middle">Negative</text>

  <!-- Row 6: pH (numeric range bar) -->
  <line x1="70" y1="508" x2="1130" y2="508" stroke="#E8E3DA" stroke-width="1"/>
  <text x="70" y="542" font-size="20" font-weight="700" fill="#2B3A3A">pH</text>
  <text x="70" y="564" font-size="15" fill="#6B7979">How acidic or alkaline the sample is</text>
  <clipPath id="bar-ph"><rect x="600" y="526" width="460" height="28" rx="8"/></clipPath>
  <g clip-path="url(#bar-ph)">
    <rect x="600" y="526" width="460" height="28" fill="#6B8E7F"/>
  </g>
  <text x="830" y="580" font-size="15" font-weight="700" fill="#2B3A3A" text-anchor="middle">4.5 to 8.0</text>

  <!-- Row 7: Specific gravity (numeric range bar) -->
  <line x1="70" y1="602" x2="1130" y2="602" stroke="#E8E3DA" stroke-width="1"/>
  <text x="70" y="636" font-size="20" font-weight="700" fill="#2B3A3A">Specific gravity</text>
  <text x="70" y="658" font-size="15" fill="#6B7979">How concentrated or diluted the urine is</text>
  <clipPath id="bar-sg"><rect x="600" y="620" width="460" height="28" rx="8"/></clipPath>
  <g clip-path="url(#bar-sg)">
    <rect x="600" y="620" width="460" height="28" fill="#6B8E7F"/>
  </g>
  <text x="830" y="674" font-size="15" font-weight="700" fill="#2B3A3A" text-anchor="middle">1.005 to 1.030</text>

  <line x1="70" y1="696" x2="1130" y2="696" stroke="#E8E3DA" stroke-width="1"/>
  <text x="70" y="740" font-size="15" fill="#9AA6A6">Standard clinical dipstick reference ranges. Exact cutoffs vary slightly by lab and testing method.</text>
  <text x="70" y="764" font-size="15" fill="#9AA6A6">A single abnormal marker is a flag for follow-up, not a diagnosis. Confirm any result with a clinician.</text>
</svg>
