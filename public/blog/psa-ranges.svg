<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="1200" height="420" fill="#F5F3EE"/>
  <text x="90" y="64" font-size="28" font-weight="800" fill="#2B3A3A">PSA: what raises the number</text>
  <text x="90" y="94" font-size="18" fill="#6B7979">A high result has several common, non-cancer causes.</text>

  <g font-size="17" fill="#2B3A3A">
    <rect x="90" y="130" width="18" height="18" rx="4" fill="#6B8E7F"/>
    <text x="120" y="145" font-weight="700">Benign prostatic hyperplasia (BPH)</text>
    <text x="120" y="168" font-size="15" font-weight="400" fill="#6B7979">Common, non-cancerous prostate enlargement with age.</text>

    <rect x="90" y="195" width="18" height="18" rx="4" fill="#6B8E7F"/>
    <text x="120" y="210" font-weight="700">Prostatitis or urinary infection</text>
    <text x="120" y="233" font-size="15" font-weight="400" fill="#6B7979">Inflammation raises PSA temporarily.</text>

    <rect x="90" y="260" width="18" height="18" rx="4" fill="#6B8E7F"/>
    <text x="120" y="275" font-weight="700">Recent ejaculation or vigorous exercise</text>
    <text x="120" y="298" font-size="15" font-weight="400" fill="#6B7979">Can raise PSA for a day or two before testing.</text>

    <rect x="90" y="325" width="18" height="18" rx="4" fill="#B0555A"/>
    <text x="120" y="340" font-weight="700">Prostate cancer</text>
    <text x="120" y="363" font-size="15" font-weight="400" fill="#6B7979">One possible cause among several; needs further testing to confirm.</text>
  </g>
</svg>
