<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="1200" height="380" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="70" y="56" font-size="30" font-weight="700" fill="#2B3A3A">Vitamin D (25-OH D) result bands</text>
  <text x="70" y="88" font-size="18" fill="#6B7979">Standard clinical thresholds — confirm the unit (nmol/L vs ng/mL) on your own report</text>

  <!-- Continuous spectrum bar -->
  <!-- Deficient: 0 to 30 nmol/L -->
  <clipPath id="bar-vd"><rect x="70" y="116" width="1060" height="48" rx="10"/></clipPath>
  <g clip-path="url(#bar-vd)">
    <!-- Deficient band: ~0-16% of bar -->
    <rect x="70"  y="116" width="170" height="48" fill="#C9594F"/>
    <!-- Insufficient band: ~16-40% -->
    <rect x="240" y="116" width="250" height="48" fill="#E0A23E"/>
    <!-- Sufficient band: ~40-88% -->
    <rect x="490" y="116" width="500" height="48" fill="#6B8E7F"/>
    <!-- Potentially toxic: ~88-100% -->
    <rect x="990" y="116" width="140" height="48" fill="#A8C5B8"/>
  </g>

  <!-- Band labels inside bar -->
  <text x="155" y="147" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Deficient</text>
  <text x="365" y="147" text-anchor="middle" font-size="14" font-weight="700" fill="#2B3A3A">Insufficient</text>
  <text x="740" y="147" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Sufficient</text>
  <text x="1060" y="147" text-anchor="middle" font-size="12" font-weight="700" fill="#2B3A3A">Excess</text>

  <!-- Threshold tick marks -->
  <line x1="240" y1="112" x2="240" y2="168" stroke="#2B3A3A" stroke-width="2"/>
  <line x1="490" y1="112" x2="490" y2="168" stroke="#2B3A3A" stroke-width="2"/>
  <line x1="990" y1="112" x2="990" y2="168" stroke="#2B3A3A" stroke-width="2"/>

  <!-- Threshold values -->
  <text x="240" y="196" text-anchor="middle" font-size="15" font-weight="700" fill="#2B3A3A">30 nmol/L</text>
  <text x="240" y="214" text-anchor="middle" font-size="13" fill="#6B7979">(12 ng/mL)</text>
  <text x="490" y="196" text-anchor="middle" font-size="15" font-weight="700" fill="#2B3A3A">50 nmol/L</text>
  <text x="490" y="214" text-anchor="middle" font-size="13" fill="#6B7979">(20 ng/mL)</text>
  <text x="990" y="196" text-anchor="middle" font-size="15" font-weight="700" fill="#2B3A3A">250 nmol/L</text>
  <text x="990" y="214" text-anchor="middle" font-size="13" fill="#6B7979">(100 ng/mL)</text>

  <!-- Divider -->
  <line x1="70" y1="238" x2="1130" y2="238" stroke="#E8E3DA" stroke-width="1"/>

  <!-- Detail rows -->
  <!-- Deficient -->
  <rect x="70" y="256" width="16" height="16" rx="3" fill="#C9594F"/>
  <text x="98" y="269" font-size="15" font-weight="700" fill="#2B3A3A">Deficient</text>
  <text x="200" y="269" font-size="15" fill="#6B7979">below 30 nmol/L (12 ng/mL) — associated with bone disease, muscle weakness, and impaired immunity</text>

  <!-- Insufficient -->
  <rect x="70" y="284" width="16" height="16" rx="3" fill="#E0A23E"/>
  <text x="98" y="297" font-size="15" font-weight="700" fill="#2B3A3A">Insufficient</text>
  <text x="200" y="297" font-size="15" fill="#6B7979">30 to 50 nmol/L (12 to 20 ng/mL) — below optimal; clinicians typically recommend correction</text>

  <!-- Sufficient -->
  <rect x="70" y="312" width="16" height="16" rx="3" fill="#6B8E7F"/>
  <text x="98" y="325" font-size="15" font-weight="700" fill="#2B3A3A">Sufficient</text>
  <text x="200" y="325" font-size="15" fill="#6B7979">50 to 125 nmol/L (20 to 50 ng/mL) — adequate for most people; optimal often cited as 75 to 125 nmol/L</text>

  <!-- Source note -->
  <text x="70" y="366" font-size="13" fill="#9AA6A6">Source: WHO Vitamin D Supplementation Guideline (2022); Endocrine Society Clinical Practice Guideline (Holick et al., 2011). Results may differ by lab.</text>
</svg>
