<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="1200" height="460" fill="#FFFFFF"/>
  <text x="70" y="56" font-size="30" font-weight="700" fill="#2B3A3A">Three ways to get a blood test in Accra</text>
  <text x="70" y="88" font-size="18" fill="#6B7979">The right option depends on urgency, budget, and whether a doctor ordered the test.</text>

  <!-- column dividers -->
  <line x1="410" y1="120" x2="410" y2="420" stroke="#E8E3DA" stroke-width="1"/>
  <line x1="790" y1="120" x2="790" y2="420" stroke="#E8E3DA" stroke-width="1"/>

  <!-- Column 1: Public hospital lab -->
  <circle cx="110" cy="150" r="10" fill="#6B8E7F"/>
  <text x="134" y="156" font-size="20" font-weight="700" fill="#2B3A3A">Public hospital lab</text>
  <text x="70" y="196" font-size="15" fill="#6B7979">Usually needs a doctor</text>
  <text x="70" y="218" font-size="15" fill="#6B7979">referral</text>
  <text x="70" y="252" font-size="15" fill="#6B7979">Walk-in, expect a queue</text>
  <text x="70" y="286" font-size="15" fill="#6B7979">Often the most affordable</text>
  <text x="70" y="308" font-size="15" fill="#6B7979">route for NHIS-eligible tests</text>
  <text x="70" y="342" font-size="15" fill="#6B7979">Best for routine or</text>
  <text x="70" y="364" font-size="15" fill="#6B7979">doctor-ordered tests</text>

  <!-- Column 2: Private diagnostic lab -->
  <circle cx="490" cy="150" r="10" fill="#6B8E7F"/>
  <text x="514" y="156" font-size="20" font-weight="700" fill="#2B3A3A">Private diagnostic lab</text>
  <text x="450" y="196" font-size="15" fill="#6B7979">Walk-in or booked</text>
  <text x="450" y="218" font-size="15" fill="#6B7979">appointment</text>
  <text x="450" y="252" font-size="15" fill="#6B7979">Wider menu of tests</text>
  <text x="450" y="286" font-size="15" fill="#6B7979">Usually faster results than</text>
  <text x="450" y="308" font-size="15" fill="#6B7979">a public facility</text>
  <text x="450" y="342" font-size="15" fill="#6B7979">Paid out of pocket unless</text>
  <text x="450" y="364" font-size="15" fill="#6B7979">insurance applies</text>

  <!-- Column 3: Home blood draw -->
  <circle cx="870" cy="150" r="10" fill="#6B8E7F"/>
  <text x="894" y="156" font-size="20" font-weight="700" fill="#2B3A3A">Home blood draw</text>
  <text x="830" y="196" font-size="15" fill="#6B7979">Book online, phlebotomist</text>
  <text x="830" y="218" font-size="15" fill="#6B7979">comes to you</text>
  <text x="830" y="252" font-size="15" fill="#6B7979">No travel or waiting room</text>
  <text x="830" y="286" font-size="15" fill="#6B7979">Results delivered digitally</text>
  <text x="830" y="308" font-size="15" fill="#6B7979">once processed</text>
  <text x="830" y="342" font-size="15" fill="#6B7979">Good fit for busy</text>
  <text x="830" y="364" font-size="15" fill="#6B7979">schedules or home visits</text>

  <line x1="70" y1="400" x2="1130" y2="400" stroke="#E8E3DA" stroke-width="1"/>
  <text x="1130" y="430" font-size="13" fill="#9AA6A6" text-anchor="end">Availability and current pricing vary. Confirm details before booking.</text>
</svg>
