<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="1200" height="460" fill="#FFFFFF"/>
  <text x="70" y="56" font-size="30" font-weight="700" fill="#2B3A3A">eGFR stages: how well your kidneys are filtering</text>
  <text x="70" y="88" font-size="18" fill="#6B7979">eGFR is reported in mL/min/1.73m2. Lower numbers mean less filtering capacity.</text>

  <!-- segmented bar, 5 stages -->
  <clipPath id="bar-egfr"><rect x="70" y="116" width="1060" height="60" rx="14"/></clipPath>
  <g clip-path="url(#bar-egfr)">
    <rect x="70"  y="116" width="212" height="60" fill="#6B8E7F"/>
    <rect x="282" y="116" width="212" height="60" fill="#9BB79E"/>
    <rect x="494" y="116" width="212" height="60" fill="#E0A23E"/>
    <rect x="706" y="116" width="212" height="60" fill="#D97B4F"/>
    <rect x="918" y="116" width="212" height="60" fill="#C9594F"/>
  </g>

  <!-- stage labels above bar -->
  <text x="176" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#2B3A3A">Normal</text>
  <text x="388" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#2B3A3A">Mild decrease</text>
  <text x="600" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#2B3A3A">Moderate decrease</text>
  <text x="812" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#2B3A3A">Severe decrease</text>
  <text x="1024" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#2B3A3A">Kidney failure</text>

  <!-- eGFR values inside/below bar -->
  <text x="176" y="207" text-anchor="middle" font-size="15" font-weight="700" fill="#2B3A3A">90 and above</text>
  <text x="388" y="207" text-anchor="middle" font-size="15" font-weight="700" fill="#2B3A3A">60 to 89</text>
  <text x="600" y="207" text-anchor="middle" font-size="15" font-weight="700" fill="#2B3A3A">30 to 59</text>
  <text x="812" y="207" text-anchor="middle" font-size="15" font-weight="700" fill="#2B3A3A">15 to 29</text>
  <text x="1024" y="207" text-anchor="middle" font-size="15" font-weight="700" fill="#2B3A3A">below 15</text>

  <line x1="70" y1="234" x2="1130" y2="234" stroke="#E8E3DA" stroke-width="1"/>

  <!-- Creatinine reference table -->
  <text x="70" y="270" font-size="22" font-weight="700" fill="#2B3A3A">Typical serum creatinine reference range</text>
  <text x="70" y="296" font-size="15" fill="#6B7979">Exact cutoffs vary by lab and by muscle mass; check the interval on your own report.</text>

  <rect x="70" y="316" width="16" height="16" rx="3" fill="#2B3A3A"/>
  <text x="98" y="329" font-size="16" font-weight="700" fill="#2B3A3A">Men</text>
  <text x="180" y="329" font-size="16" fill="#6B7979">about 60 to 110 micromol/L (0.7 to 1.3 mg/dL)</text>

  <rect x="70" y="344" width="16" height="16" rx="3" fill="#6B8E7F"/>
  <text x="98" y="357" font-size="16" font-weight="700" fill="#2B3A3A">Women</text>
  <text x="200" y="357" font-size="16" fill="#6B7979">about 45 to 90 micromol/L (0.5 to 1.0 mg/dL)</text>

  <text x="70" y="392" font-size="14" fill="#6B7979">Creatinine and eGFR move in opposite directions: as kidney filtering falls, creatinine rises and eGFR falls.</text>

  <text x="70" y="428" font-size="13" fill="#9AA6A6">Source: KDIGO 2012 Clinical Practice Guideline for CKD; National Kidney Foundation. Results may differ by lab.</text>
</svg>
