<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="1200" height="480" fill="#FFFFFF"/>
  <text x="70" y="66" font-size="34" font-weight="700" fill="#2B3A3A">A raised PSA has several everyday causes</text>
  <text x="70" y="100" font-size="20" fill="#6B7979">Cancer is only one possibility on this list, not the default explanation</text>

  <!-- five cards -->
  <g>
    <rect x="70" y="140" width="204" height="230" rx="16" fill="#F5F3EE"/>
    <circle cx="172" cy="196" r="26" fill="#6B8E7F" fill-opacity="0.18"/>
    <text x="172" y="204" font-size="24" text-anchor="middle" fill="#6B8E7F" font-weight="700">BPH</text>
    <text x="172" y="248" font-size="17" text-anchor="middle" fill="#2B3A3A" font-weight="700">Enlarged</text>
    <text x="172" y="270" font-size="17" text-anchor="middle" fill="#2B3A3A" font-weight="700">prostate</text>
    <text x="172" y="300" font-size="14" text-anchor="middle" fill="#6B7979">Non-cancerous,</text>
    <text x="172" y="318" font-size="14" text-anchor="middle" fill="#6B7979">common with age</text>
  </g>

  <g>
    <rect x="294" y="140" width="204" height="230" rx="16" fill="#F5F3EE"/>
    <circle cx="396" cy="196" r="26" fill="#6B8E7F" fill-opacity="0.18"/>
    <text x="396" y="204" font-size="18" text-anchor="middle" fill="#6B8E7F" font-weight="700">+</text>
    <text x="396" y="248" font-size="17" text-anchor="middle" fill="#2B3A3A" font-weight="700">Prostatitis</text>
    <text x="396" y="270" font-size="17" text-anchor="middle" fill="#2B3A3A" font-weight="700">(infection)</text>
    <text x="396" y="300" font-size="14" text-anchor="middle" fill="#6B7979">Inflammation raises</text>
    <text x="396" y="318" font-size="14" text-anchor="middle" fill="#6B7979">PSA temporarily</text>
  </g>

  <g>
    <rect x="518" y="140" width="204" height="230" rx="16" fill="#F5F3EE"/>
    <circle cx="620" cy="196" r="26" fill="#6B8E7F" fill-opacity="0.18"/>
    <text x="620" y="204" font-size="22" text-anchor="middle" fill="#6B8E7F" font-weight="700">24h</text>
    <text x="620" y="248" font-size="17" text-anchor="middle" fill="#2B3A3A" font-weight="700">Recent</text>
    <text x="620" y="270" font-size="17" text-anchor="middle" fill="#2B3A3A" font-weight="700">ejaculation</text>
    <text x="620" y="300" font-size="14" text-anchor="middle" fill="#6B7979">Can raise PSA for</text>
    <text x="620" y="318" font-size="14" text-anchor="middle" fill="#6B7979">a day or two</text>
  </g>

  <g>
    <rect x="742" y="140" width="204" height="230" rx="16" fill="#F5F3EE"/>
    <circle cx="844" cy="196" r="26" fill="#6B8E7F" fill-opacity="0.18"/>
    <text x="844" y="204" font-size="16" text-anchor="middle" fill="#6B8E7F" font-weight="700">cath</text>
    <text x="844" y="248" font-size="17" text-anchor="middle" fill="#2B3A3A" font-weight="700">Catheter or</text>
    <text x="844" y="270" font-size="17" text-anchor="middle" fill="#2B3A3A" font-weight="700">recent exam</text>
    <text x="844" y="300" font-size="14" text-anchor="middle" fill="#6B7979">Irritates the</text>
    <text x="844" y="318" font-size="14" text-anchor="middle" fill="#6B7979">prostate briefly</text>
  </g>

  <g>
    <rect x="966" y="140" width="204" height="230" rx="16" fill="#F5F3EE"/>
    <circle cx="1068" cy="196" r="26" fill="#6B8E7F" fill-opacity="0.18"/>
    <text x="1068" y="204" font-size="20" text-anchor="middle" fill="#6B8E7F" font-weight="700">ex.</text>
    <text x="1068" y="248" font-size="17" text-anchor="middle" fill="#2B3A3A" font-weight="700">Vigorous</text>
    <text x="1068" y="270" font-size="17" text-anchor="middle" fill="#2B3A3A" font-weight="700">exercise</text>
    <text x="1068" y="300" font-size="14" text-anchor="middle" fill="#6B7979">Cycling especially,</text>
    <text x="1068" y="318" font-size="14" text-anchor="middle" fill="#6B7979">shortly before test</text>
  </g>

  <text x="70" y="420" font-size="15" fill="#9AA6A6">A raised PSA is a signal to talk to a clinician and look closer, not a diagnosis by itself.</text>
</svg>
