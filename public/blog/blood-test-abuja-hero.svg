    <path d="M18 9 l9 8 h-3 v10 h-12 v-10 h-3 z" fill="#6B8E7F"/>
  </g>
  <g fill="#C9594F">
    <circle cx="150" cy="400" r="5"/>
    <circle cx="178" cy="400" r="5"/>
    <circle cx="206" cy="400" r="5"/>
    <circle cx="234" cy="400" r="5"/>
    <circle cx="262" cy="400" r="5"/>
  </g>
  <text x="150" y="440" font-size="16" fill="#6B7979">Garki to Gwarinpa</text>
  <g transform="translate(320,382)">
