<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <radialGradient id="ngOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6B8E7F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6B8E7F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="480" fill="#F5F3EE"/>
  <circle cx="1020" cy="140" r="320" fill="url(#ngOrb)"/>

  <text x="90" y="150" font-size="22" font-weight="700" letter-spacing="3" fill="#6B8E7F">HEALTH SCREENING IN NIGERIA</text>
  <text x="86" y="228" font-size="54" font-weight="800" fill="#2B3A3A">What to test,</text>
  <text x="86" y="290" font-size="54" font-weight="800" fill="#2B3A3A">and how often</text>
  <text x="90" y="336" font-size="24" fill="#6B7979">A short panel shaped by Nigeria's own disease burden.</text>

  <!-- condition pill badges -->
  <g font-size="19" font-weight="700" fill="#2B3A3A">
    <rect x="90" y="370" width="150" height="50" rx="25" fill="#EAF1EC" stroke="#6B8E7F" stroke-width="2"/>
    <text x="165" y="403" text-anchor="middle">BP &amp; sugar</text>

    <rect x="252" y="370" width="150" height="50" rx="25" fill="#F3EEDF" stroke="#E0A23E" stroke-width="2"/>
    <text x="327" y="403" text-anchor="middle">Genotype</text>

    <rect x="414" y="370" width="150" height="50" rx="25" fill="#F6E3E0" stroke="#C9594F" stroke-width="2"/>
    <text x="489" y="403" text-anchor="middle">Hepatitis B</text>

    <rect x="576" y="370" width="150" height="50" rx="25" fill="#EDEAF6" stroke="#8E7FC9" stroke-width="2"/>
    <text x="651" y="403" text-anchor="middle">HIV</text>
  </g>
</svg>
