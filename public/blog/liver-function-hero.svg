<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-label="Liver function tests explained: what ALT and AST results mean" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
