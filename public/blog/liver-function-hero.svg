  <path d="M 980 130 C 940 110, 900 150, 910 200 C 918 245, 970 270, 1030 260 C 1085 250, 1130 210, 1115 165 C 1100 122, 1030 105, 980 130 Z" fill="#D97B4F" opacity="0.22"/>
