  <text x="86" y="252" font-size="54" font-weight="800" fill="#2B3A3A">ALT and AST</text>
  <text x="90" y="304" font-size="26" fill="#6B7979">What your liver function test numbers mean</text>

  <rect x="90" y="344" width="110" height="42" rx="21" fill="#2B3A3A"/>
  <text x="145" y="371" text-anchor="middle" font-size="16" font-weight="700" fill="#F5F3EE">ALT</text>

