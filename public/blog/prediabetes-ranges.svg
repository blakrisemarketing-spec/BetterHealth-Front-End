<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="HbA1c ranges for prediabetes: normal below 5.7%, prediabetes 5.7% to 6.4%, diabetes 6.5% and above">
  <title>Prediabetes Diagnostic Ranges: HbA1c and Fasting Blood Sugar</title>
  <defs>
    <linearGradient id="pdNormalGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="pdPreGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="pdDiabGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="720" height="300" fill="#F9FAFB" rx="12"/>

  <!-- Title -->
  <text x="360" y="34" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="bold" fill="#111827">Prediabetes Diagnostic Ranges</text>
  <text x="360" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">ADA 2024 criteria (used in most Ghanaian labs)</text>

  <!-- HbA1c label -->
  <text x="60" y="84" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#374151">HbA1c (%)</text>

  <!-- HbA1c bar: scale 3% to 8% = 5 units across 600px. 1% = 120px -->
  <!-- Normal: 3 to 5.7 = 2.7 units = 324px -->
  <!-- Prediabetes: 5.7 to 6.4 = 0.7 units = 84px -->
  <!-- Diabetes: 6.4 to 8+ = 1.6+ units = 192px -->
  <rect x="60" y="92" width="600" height="44" rx="22" fill="#E5E7EB"/>

  <rect x="60" y="92" width="324" height="44" rx="22 0 0 22" fill="url(#pdNormalGrad)"/>
  <rect x="384" y="92" width="84" height="44" fill="url(#pdPreGrad)"/>
  <rect x="468" y="92" width="192" height="44" rx="0 22 22 0" fill="url(#pdDiabGrad)"/>

  <text x="200" y="119" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Normal</text>
  <text x="426" y="119" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">Pre-DM</text>
  <text x="556" y="119" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Diabetes</text>

  <!-- HbA1c tick marks -->
  <line x1="60" y1="138" x2="60" y2="150" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="60" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">3%</text>

  <line x1="384" y1="136" x2="384" y2="150" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="384" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#374151">5.7%</text>

  <line x1="468" y1="136" x2="468" y2="150" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="468" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#374151">6.5%</text>

  <line x1="660" y1="138" x2="660" y2="150" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="660" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">8%+</text>

  <!-- Fasting glucose row -->
  <text x="60" y="192" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#374151">Fasting glucose</text>

  <rect x="60" y="200" width="14" height="14" rx="3" fill="#16A34A"/>
  <text x="82" y="213" font-family="Arial, sans-serif" font-size="12" fill="#111827">Normal: below 5.6 mmol/L (below 100 mg/dL)</text>

  <rect x="60" y="222" width="14" height="14" rx="3" fill="#D97706"/>
  <text x="82" y="235" font-family="Arial, sans-serif" font-size="12" fill="#111827">Prediabetes: 5.6 to 6.9 mmol/L (100 to 125 mg/dL)</text>

  <rect x="60" y="244" width="14" height="14" rx="3" fill="#DC2626"/>
  <text x="82" y="257" font-family="Arial, sans-serif" font-size="12" fill="#111827">Diabetes: 7.0 mmol/L or above (126 mg/dL or above)</text>

  <!-- Source -->
  <text x="360" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#9CA3AF">ADA Standards of Care 2024 · WHO 2006 diagnostic criteria</text>
</svg>
