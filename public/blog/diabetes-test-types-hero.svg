<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <radialGradient id="orbDT" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6B8E7F" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#6B8E7F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="480" fill="#F5F3EE"/>
  <circle cx="1010" cy="140" r="320" fill="url(#orbDT)"/>

  <text x="90" y="150" font-size="22" font-weight="700" letter-spacing="3" fill="#6B8E7F">UNDERSTANDING YOUR BIOMARKERS</text>
  <text x="86" y="228" font-size="52" font-weight="800" fill="#2B3A3A">Diabetes tests, compared</text>
  <text x="90" y="270" font-size="24" fill="#6B7979">Fasting glucose, HbA1c and the OGTT, side by side.</text>

  <!-- four test chips -->
  <g transform="translate(90,320)">
    <rect x="0" y="0" width="230" height="92" rx="14" fill="#FFFFFF" stroke="#E8E3DA" stroke-width="2"/>
    <circle cx="34" cy="34" r="14" fill="#6B8E7F"/>
    <text x="34" y="39" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">F</text>
    <text x="60" y="30" font-size="15" font-weight="700" fill="#2B3A3A">Fasting glucose</text>
    <text x="60" y="50" font-size="12" fill="#9AA6A6">Single reading, 8h fast</text>
    <text x="18" y="76" font-size="12" fill="#6B7979">One morning snapshot</text>
  </g>

  <g transform="translate(340,320)">
    <rect x="0" y="0" width="230" height="92" rx="14" fill="#FFFFFF" stroke="#E8E3DA" stroke-width="2"/>
    <circle cx="34" cy="34" r="14" fill="#8FAE9E"/>
    <text x="34" y="39" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">R</text>
    <text x="60" y="30" font-size="15" font-weight="700" fill="#2B3A3A">Random glucose</text>
    <text x="60" y="50" font-size="12" fill="#9AA6A6">Any time, no fasting</text>
    <text x="18" y="76" font-size="12" fill="#6B7979">Used with symptoms</text>
  </g>

  <g transform="translate(590,320)">
    <rect x="0" y="0" width="230" height="92" rx="14" fill="#FFFFFF" stroke="#E8E3DA" stroke-width="2"/>
    <circle cx="34" cy="34" r="14" fill="#D97B4F"/>
    <text x="34" y="39" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">A1c</text>
    <text x="60" y="30" font-size="15" font-weight="700" fill="#2B3A3A">HbA1c</text>
    <text x="60" y="50" font-size="12" fill="#9AA6A6">No fasting needed</text>
    <text x="18" y="76" font-size="12" fill="#6B7979">2 to 3 month average</text>
  </g>

  <g transform="translate(840,320)">
    <rect x="0" y="0" width="230" height="92" rx="14" fill="#FFFFFF" stroke="#E8E3DA" stroke-width="2"/>
    <circle cx="34" cy="34" r="14" fill="#C9594F"/>
    <text x="34" y="39" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">O</text>
    <text x="60" y="30" font-size="15" font-weight="700" fill="#2B3A3A">OGTT</text>
    <text x="60" y="50" font-size="12" fill="#9AA6A6">Fasting + 2h challenge</text>
    <text x="18" y="76" font-size="12" fill="#6B7979">Pregnancy, borderline results</text>
  </g>
</svg>
