<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6B8E7F" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#6B8E7F" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#6B8E7F" fill-opacity="0.6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="#F5F3EE"/>
  <circle cx="1010" cy="150" r="320" fill="url(#orb)"/>

  <!-- Category label -->
  <text x="90" y="172" font-size="22" font-weight="700" letter-spacing="3" fill="#6B8E7F">CONDITIONS · LIVER HEALTH</text>

  <!-- Main title -->
  <text x="86" y="256" font-size="54" font-weight="800" fill="#2B3A3A">Fatty Liver Disease, explained</text>

  <!-- Subtitle -->
  <text x="90" y="306" font-size="26" fill="#6B7979">Silent, common, and often reversible when caught early.</text>

  <!-- Rising progression curve (bottom-right area only, x > 720) -->
  <path d="M 730 440 C 820 430, 880 400, 940 360 S 1040 280, 1090 210"
    fill="none" stroke="#6B8E7F" stroke-width="5" stroke-linecap="round"
    marker-end="url(#arrow)"/>

  <!-- Stage dots along the curve -->
  <circle cx="760" cy="438" r="10" fill="#6B8E7F"/>
  <circle cx="870" cy="400" r="11" fill="#C28A2E"/>
  <circle cx="990" cy="310" r="11" fill="#C9594F" fill-opacity="0.75"/>
  <circle cx="1090" cy="210" r="14" fill="#C9594F"/>
  <circle cx="1090" cy="210" r="24" fill="none" stroke="#C9594F" stroke-width="3" stroke-opacity="0.35"/>

  <!-- Stage labels -->
  <text x="760" y="462" font-size="14" fill="#6B7979" text-anchor="middle">Healthy</text>
  <text x="870" y="424" font-size="14" fill="#6B7979" text-anchor="middle">Steatosis</text>
  <text x="990" y="334" font-size="14" fill="#6B7979" text-anchor="middle">NASH</text>
  <text x="1090" y="248" font-size="14" fill="#6B7979" text-anchor="middle">Cirrhosis</text>
</svg>
