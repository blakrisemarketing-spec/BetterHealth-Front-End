<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8E7FC9" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8E7FC9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="480" fill="#F5F3EE"/>
  <circle cx="1020" cy="140" r="320" fill="url(#orb)"/>

  <text x="90" y="130" font-size="22" font-weight="700" letter-spacing="3" fill="#6B8E7F">PREGNANCY SCREENING</text>
  <text x="86" y="204" font-size="50" font-weight="800" fill="#2B3A3A">Gestational diabetes,</text>
  <text x="86" y="264" font-size="50" font-weight="800" fill="#2B3A3A">screened and explained</text>
  <text x="90" y="308" font-size="24" fill="#6B7979">How the OGTT works, what the numbers mean, and what happens next.</text>

  <!-- info badges -->
  <g font-size="19" font-weight="700" fill="#2B3A3A">
    <rect x="90" y="348" width="176" height="50" rx="25" fill="#EDEAF6" stroke="#8E7FC9" stroke-width="2"/>
    <text x="178" y="380" text-anchor="middle">24 to 28 weeks</text>

    <rect x="284" y="348" width="150" height="50" rx="25" fill="#EAF1EC" stroke="#6B8E7F" stroke-width="2"/>
    <text x="359" y="380" text-anchor="middle">75g OGTT</text>

    <rect x="450" y="348" width="176" height="50" rx="25" fill="#F3EEDF" stroke="#E0A23E" stroke-width="2"/>
    <text x="538" y="380" text-anchor="middle">3 blood draws</text>

    <rect x="644" y="348" width="196" height="50" rx="25" fill="#FBF0EE" stroke="#C9594F" stroke-width="2"/>
    <text x="742" y="380" text-anchor="middle">Usually resolves</text>
  </g>

  <!-- simple flat icon: pregnancy silhouette with a glucose drop -->
  <g transform="translate(990, 300)">
    <path d="M 0 150 C -34 150, -52 118, -52 82 C -52 40, -28 4, 4 -8 C -6 -20, -8 -36, 2 -50 C 14 -66, 40 -68, 54 -54 C 66 -42, 66 -22, 54 -10 C 84 4, 100 36, 96 74 C 92 118, 60 150, 20 150 Z" fill="#6B8E7F" opacity="0.9"/>
    <circle cx="30" cy="-30" r="13" fill="#F5F3EE"/>
    <path d="M 118 40 C 118 62, 100 78, 80 78 C 60 78, 42 62, 42 40 C 42 18, 80 -26, 80 -26 C 80 -26, 118 18, 118 40 Z" fill="#C9594F"/>
    <circle cx="70" cy="34" r="8" fill="#FBF0EE" opacity="0.7"/>
  </g>

  <text x="90" y="440" font-size="15" fill="#9AA6A6">Based on WHO 2013 / IADPSG diagnostic criteria. Your lab's reference range and antenatal team take precedence.</text>
</svg>
