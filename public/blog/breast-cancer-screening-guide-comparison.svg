<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="1200" height="460" fill="#FFFFFF"/>
  <text x="70" y="56" font-size="30" font-weight="700" fill="#2B3A3A">Three ways to screen, working together</text>
  <text x="70" y="88" font-size="18" fill="#6B7979">None of the three replaces the others. Each catches something the others might miss.</text>

  <!-- three cards -->
  <g>
    <rect x="70" y="116" width="330" height="300" rx="16" fill="#F5F3EE" stroke="#6B8E7F" stroke-width="2"/>
    <circle cx="110" cy="158" r="10" fill="#6B8E7F"/>
    <text x="132" y="165" font-size="21" font-weight="700" fill="#2B3A3A">Self-awareness</text>
    <text x="94" y="202" font-size="15" fill="#6B7979">Who</text>
    <text x="94" y="224" font-size="16" fill="#2B3A3A">Every adult woman, ongoing</text>
    <text x="94" y="258" font-size="15" fill="#6B7979">How often</text>
    <text x="94" y="280" font-size="16" fill="#2B3A3A">Whenever you notice your body</text>
    <text x="94" y="300" font-size="16" fill="#2B3A3A">(no fixed schedule)</text>
    <text x="94" y="334" font-size="15" fill="#6B7979">What it catches</text>
    <text x="94" y="356" font-size="16" fill="#2B3A3A">New changes only you would</text>
    <text x="94" y="376" font-size="16" fill="#2B3A3A">notice first</text>
  </g>

  <g>
    <rect x="435" y="116" width="330" height="300" rx="16" fill="#F5F3EE" stroke="#6B8E7F" stroke-width="2"/>
    <circle cx="475" cy="158" r="10" fill="#6B8E7F"/>
    <text x="497" y="165" font-size="21" font-weight="700" fill="#2B3A3A">Clinical breast exam</text>
    <text x="459" y="202" font-size="15" fill="#6B7979">Who</text>
    <text x="459" y="224" font-size="16" fill="#2B3A3A">Done by a doctor or nurse</text>
    <text x="459" y="258" font-size="15" fill="#6B7979">How often</text>
    <text x="459" y="280" font-size="16" fill="#2B3A3A">Part of a routine check-up,</text>
    <text x="459" y="300" font-size="16" fill="#2B3A3A">per your clinician's guidance</text>
    <text x="459" y="334" font-size="15" fill="#6B7979">What it catches</text>
    <text x="459" y="356" font-size="16" fill="#2B3A3A">A trained hand may notice what</text>
    <text x="459" y="376" font-size="16" fill="#2B3A3A">self-checks miss</text>
  </g>

  <g>
    <rect x="800" y="116" width="330" height="300" rx="16" fill="#F5F3EE" stroke="#6B8E7F" stroke-width="2"/>
    <circle cx="840" cy="158" r="10" fill="#6B8E7F"/>
    <text x="862" y="165" font-size="21" font-weight="700" fill="#2B3A3A">Mammogram</text>
    <text x="824" y="202" font-size="15" fill="#6B7979">Who</text>
    <text x="824" y="224" font-size="16" fill="#2B3A3A">Ages and risk groups set by</text>
    <text x="824" y="244" font-size="16" fill="#2B3A3A">guideline and history</text>
    <text x="824" y="278" font-size="15" fill="#6B7979">How often</text>
    <text x="824" y="300" font-size="16" fill="#2B3A3A">Typically every 1 to 2 years</text>
    <text x="824" y="320" font-size="16" fill="#2B3A3A">once screening starts</text>
    <text x="824" y="354" font-size="15" fill="#6B7979">What it catches</text>
    <text x="824" y="376" font-size="16" fill="#2B3A3A">Changes years before they can</text>
    <text x="824" y="396" font-size="16" fill="#2B3A3A">be felt by hand</text>
  </g>

  <text x="70" y="444" font-size="14" fill="#9AA6A6">General guidance, not a prescription. Ages, intervals, and risk categories vary by country and by your own history.</text>
</svg>
