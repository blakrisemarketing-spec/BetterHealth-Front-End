# SEO content & technical backlog — patients-led, Ghana-first.
#
# The nightly routine processes the FIRST item with `status: todo` (top-to-bottom),
# so order = priority. After publishing, it flips the item to `status: done` and
# records the date. Add new items at the right priority; never reorder `done` items.
#
# Item shape:
#   - id:        stable unique id (used as idempotency key)
#     type:      article | programmatic | technical | offsite
#     cluster:   topic cluster (hub-and-spoke grouping)
#     slug:      target /blog/<slug> (articles) or route (programmatic)
#     keyword:   primary target query
#     intent:    informational | commercial | local | transactional
#     title:     working title
#     status:    todo | done | in_progress
#     notes:     optional brief pointer / context
#
# Clusters (hubs):
#   biomarkers  -> "understand your biomarkers" hub (/what-we-test is the pillar)
#   screening   -> "preventive screening in Ghana" hub (pillar article below)
#   conditions  -> "conditions we catch early" hub
#   local       -> city/region landing intent
#   decision    -> cost / comparison / how-to-choose intent

