# SEO content & technical backlog — patients-led, Africa-first (Ghana home market).
#
# The nightly routine publishes the FIRST FIVE `status: todo` article items
# (top-to-bottom) per run as ONE PR, so order = priority. After publishing, each is
# flipped to `status: done` with a date. Add new items at the right priority; never
# reorder `done` items.
#
# SCOPE: all of Africa. Ghana is the home market, but targets now span Nigeria, Kenya,
# South Africa, and the wider continent. Give each item a `market` so the nightly pulls
# the right DataForSEO location and writes market-appropriate local framing.
#
# `volume` = monthly searches for the primary keyword in the item's `market`
# (DataForSEO; null = no/low data confirmed yet, still worth long-tail + AI-citation
# value). Pan-African expansion items added 2026-06-28 carry `volume: null` pending
# per-market DataForSEO confirmation in the nightly's refine step.
#
# Item shape:
#   - id / type / cluster / slug / keyword / intent / title / status
#   - market:  ghana | nigeria | kenya | south-africa | pan-africa  (default ghana)
#   - volume:  monthly searches in `market` (DataForSEO), or null
#   - secondary: extra terms the article should also cover
#   - notes: brief pointer / context
#
# Clusters: biomarkers | screening | conditions | local | decision
# DataForSEO location codes: ghana 2288 | nigeria 2566 | kenya 2404 | south-africa 2710

meta:
  market: africa
  home_market: ghana
  markets: [ghana, nigeria, kenya, south-africa, pan-africa]
  primary_language: en
  focus: patients-led
  cadence: "5 articles/night, one PR (batch); see seo/playbook.md"
  updated: 2026-07-19
  keyword_data: "DataForSEO multi-market (Ghana 2026-06 confirmed; Nigeria/Kenya pan-Africa expansion volumes confirmed 2026-07-05 for blood group/widal/genotype/PSA/G6PD/malaria/HIV/uric acid/hepatitis B/urinalysis/premarital/Nairobi/hepatitis C; 2026-07-12 confirmed G6PD 390/mo, urinalysis 110/mo, vitamin B12 10/mo, antenatal blood tests 10/mo, blood test Lagos 10/mo Ghana/Nigeria; 2026-07-19 re-confirmed malaria test 320/mo, widal test 1000/mo, hepatitis B test 110/mo, liver function test results explained 10/mo — these were reported confirmed on 2026-07-05/07-12 but the volume fields were never written back to this file; corrected this week (see weekly-2026-W29 note about the same recurring write-back gap). h pylori/stool/CRP/screening-nigeria/screening-kenya/cost-of-screening/full-body-checkup/home-vs-lab/local-accra/local-kumasi still show no DataForSEO data (2026-07-19 re-checked: still no data). South Africa still pending)"

